<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سالن پرورش طوطی آرا قزوین</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b1510;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .poster-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      line-height: 0;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      background: #0b1510;
    }
    .poster-img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    /* محدوده‌های لمسی روی پوستر */
    .hotspot {
      position: absolute;
      display: block;
      z-index: 10;
      cursor: pointer;
      background: rgba(255, 255, 255, 0);
      text-decoration: none;
    }
    .hotspot:active {
      background: rgba(46, 204, 113, 0.25);
    }

    /* پاپ‌آپ و مودال */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .modal-card {
      background: #12231b;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      border-radius: 20px 20px 0 0;
      border-top: 2px solid #2ecc71;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      color: #e0e0e0;
      line-height: 1.6;
    }
    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }
    .modal-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .modal-header h3 {
      margin: 0;
      font-size: 1.15rem;
      color: #2ecc71;
    }
    .modal-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      font-size: 1.4rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      font-size: 0.95rem;
      max-height: calc(85vh - 70px);
    }
    .modal-body p {
      margin-bottom: 12px;
    }
    .modal-body ul {
      margin-right: 20px;
      margin-bottom: 15px;
    }

    /* دکمه‌های اکشن */
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .action-btn {
      flex: 1;
      min-width: 130px;
      padding: 11px 14px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-call { background: #27ae60; color: #fff; }
    .btn-add { background: #f39c12; color: #fff; width: 100%; margin-top: 12px; }
    .btn-insta { background: #e1306c; color: #fff; }

    /* گالری داخل مودال */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .gallery-item {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .gallery-item img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }
    .gallery-item-title {
      padding: 6px;
      font-size: 0.8rem;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="poster-container">
    <img src="hero.png" alt="پوستر طوطی آرا قزوین" class="poster-img">

    <!-- ۱. منوی بسیار بالای پوستر -->
    <a href="#quick-contact" class="hotspot" style="top: 1.8%; left: 3%; width: 15%; height: 3.2%;" title="تماس سریع"></a>
    <a href="#contact" class="hotspot" style="top: 1.8%; left: 18%; width: 16%; height: 3.2%;" title="تماس با ما"></a>
    <a href="#care" class="hotspot" style="top: 1.8%; left: 34%; width: 23%; height: 3.2%;" title="نگهداری پرندگان"></a>
    <a href="#gallery" class="hotspot" style="top: 1.8%; left: 57%; width: 15%; height: 3.2%;" title="گالری"></a>
    <a href="#birds" class="hotspot" style="top: 1.8%; left: 72%; width: 14%; height: 3.2%;" title="پرندگان"></a>
    <a href="#about" class="hotspot" style="top: 1.8%; left: 86%; width: 12%; height: 3.2%;" title="درباره ما"></a>

    <!-- ۲. سه طوطی بالای پوستر روی شاخه (عکس‌های اصلی) -->
    <!-- طوطی خورشیدی (سمت راست) -->
    <a href="#bird/sun" class="hotspot" style="top: 10%; left: 52%; width: 44%; height: 23%;" title="طوطی خورشیدی"></a>
    <!-- طوطی راهب (وسط) -->
    <a href="#bird/monk" class="hotspot" style="top: 12%; left: 24%; width: 28%; height: 21%;" title="طوطی راهب"></a>
    <!-- طوطی گرین‌چیک (سمت چپ) -->
    <a href="#bird/green-cheek" class="hotspot" style="top: 13%; left: 3%; width: 22%; height: 20%;" title="طوطی گرین‌چیک"></a>

    <!-- ۳. سه کارت پرنده در بخش میانی پوستر -->
    <a href="#bird/sun" class="hotspot" style="top: 46%; left: 5%; width: 28%; height: 12%;" title="کارت خورشیدی"></a>
    <a href="#bird/monk" class="hotspot" style="top: 46%; left: 36%; width: 28%; height: 12%;" title="کارت راهب"></a>
    <a href="#bird/green-cheek" class="hotspot" style="top: 46%; left: 67%; width: 28%; height: 12%;" title="کارت گرین‌چیک"></a>

    <!-- ۴. بخش‌های متنی نگهداری و درباره ما در پوستر -->
    <a href="#care" class="hotspot" style="top: 59%; left: 5%; width: 90%; height: 7%;" title="راهنمای نگهداری"></a>
    <a href="#about" class="hotspot" style="top: 67%; left: 5%; width: 90%; height: 9%;" title="درباره سالن آرا"></a>

    <!-- ۵. دکمه‌های شبکه‌های اجتماعی و تماس پایین پوستر -->
    <a href="tel:09107488013" class="hotspot" style="top: 78%; left: 5%; width: 43%; height: 5%;" title="تماس تلفنی"></a>
    <a href="https://wa.me/989107488013" class="hotspot" style="top: 78%; left: 52%; width: 43%; height: 5%;" title="واتساپ"></a>
    <a href="https://instagram.com/toti_ara" target="_blank" class="hotspot" style="top: 84%; left: 5%; width: 43%; height: 5%;" title="اینستاگرام"></a>
    <a href="https://t.me/toti_ara" target="_blank" class="hotspot" style="top: 84%; left: 52%; width: 43%; height: 5%;" title="تلگرام"></a>
  </div>

  <!-- پنجره مودال پاپ‌آپ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">عنوان</h3>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const BIRDS_DATA = {
      'sun': {
        title: 'طوطی خورشیدی (سان کانور)',
        categoryName: 'خورشیدی',
        text: 'طوطی خورشیدی پرنده‌ای بسیار بازیگوش، باهوش و با رنگ‌آمیزی فوق‌العاده درخشان زرد و نارنجی است.',
        points: ['رنگ‌آمیزی جذاب و خیره‌کننده', 'بسیار اجتماعی و دستی', 'مناسب برای بازی و آموزش'],
        category: 'sun'
      },
      'monk': {
        title: 'طوطی راهب (کواکر)',
        categoryName: 'راهب',
        text: 'طوطی راهب از باهوش‌ترین طوطی‌ها با توانایی و استعداد بسیار عالی در سخنگویی و یادگیری است.',
        points: ['استعداد بالا در صحبت کردن و کلمات', 'شخصیت جسور و کنجکاو', 'بسیار مهربان و وابسته به صاحب خود'],
        category: 'monk'
      },
      'green-cheek': {
        title: 'طوطی گرین‌چیک',
        categoryName: 'گرین‌چیک',
        text: 'طوطی گرین‌چیک پرنده‌ای بسیار آرام، بی‌صدا، مناسب برای آپارتمان و فوق‌العاده لوس و نوازشی است.',
        points: ['صدای بسیار کم (ایده‌آل برای محیط آپارتمان)', 'تنوع در جهش‌های رنگی آناناسی، یلوساید و تراکویس', 'فوق‌العاده لوس و علاقه‌مند به نوازش'],
        category: 'green-cheek'
      }
    };

    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    function closeModal() {
      modalOverlay.classList.remove('active');
      history.replaceState(null, null, ' ');
    }

    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    function handleRoute() {
      const hash = window.location.hash.replace('#', '').trim();
      if (!hash) {
        modalOverlay.classList.remove('active');
        return;
      }

      if (hash.startsWith('bird/')) {
        const type = hash.replace('bird/', '');
        const bird = BIRDS_DATA[type];
        if (bird) {
          modalTitle.textContent = bird.title;
          modalBody.innerHTML = `
            <p>${bird.text}</p>
            <ul>${bird.points.map(p => `<li>${p}</li>`).join('')}</ul>
            <div class="modal-actions">
              <a href="tel:09107488013" class="action-btn btn-call">📞 استعلام قیمت و خرید</a>
              <a href="https://instagram.com/toti_ara" target="_blank" class="action-btn btn-insta">📷 پیج اینستاگرام</a>
            </div>
            <!-- دکمه مستقیم افزودن عکس پرنده -->
            <a href="admin.html" class="action-btn btn-add">➕ افزودن عکس یا پرنده به دسته ${bird.categoryName}</a>
            <div id="birdGallery" class="gallery-grid"></div>
          `;
          modalOverlay.classList.add('active');
          loadCategoryImages(bird.category);
        }
      } else if (hash === 'contact' || hash === 'quick-contact') {
        modalTitle.textContent = 'ارتباط با سالن طوطی آرا';
        modalBody.innerHTML = `
          <p><strong>آدرس:</strong> قزوین، شهرک مینودر</p>
          <p><strong>شماره تماس / هماهنگی:</strong> ۰۹۱۰۷۴۸۸۰۱۳</p>
          <div class="modal-actions">
            <a href="tel:09107488013" class="action-btn btn-call">📞 تماس مستقیم</a>
            <a href="https://wa.me/989107488013" class="action-btn btn-call" style="background:#25d366;">💬 واتساپ</a>
          </div>
        `;
        modalOverlay.classList.add('active');
      } else if (hash === 'care') {
        modalTitle.textContent = 'اصول نگهداری طوطی‌سانان';
        modalBody.innerHTML = `
          <p><strong>تغذیه مناسب:</strong> استفاده از پلت معتبر، دانه‌های مقوی و سبزیجات تازه روزانه.</p>
          <p><strong>محیط:</strong> دور بودن از باد مستقیم، دمای معتدل (۲۰ الی ۲۶ درجه) و آب تازه و تمیز.</p>
          <div class="modal-actions">
            <a href="tel:09107488013" class="action-btn btn-call">📞 مشاوره نگهداری</a>
          </div>
        `;
        modalOverlay.classList.add('active');
      } else if (hash === 'about') {
        modalTitle.textContent = 'درباره سالن پرورش طوطی آرا';
        modalBody.innerHTML = `
          <p>مجموعه <strong>طوطی آرا قزوین</strong> تخصصی‌ترین مرکز پرورش و تکثیر طوطی‌سانان رام و دستی شامل گرین‌چیک، راهب (کواکر) و خورشیدی می‌باشد.</p>
          <div class="modal-actions">
            <a href="https://instagram.com/toti_ara" target="_blank" class="action-btn btn-insta">مشاهده اینستاگرام</a>
          </div>
        `;
        modalOverlay.classList.add('active');
      } else if (hash === 'gallery' || hash === 'birds') {
        modalTitle.textContent = 'انتخاب گونه طوطی';
        modalBody.innerHTML = `
          <p>برای مشاهده گالری و ثبت عکس، گونه مورد نظر را انتخاب کنید:</p>
          <div class="modal-actions" style="flex-direction: column;">
            <a href="#bird/sun" class="action-btn btn-call" style="background:#e67e22;">طوطی خورشیدی</a>
            <a href="#bird/monk" class="action-btn btn-call" style="background:#27ae60;">طوطی راهب</a>
            <a href="#bird/green-cheek" class="action-btn btn-call" style="background:#16a085;">طوطی گرین‌چیک</a>
          </div>
        `;
        modalOverlay.classList.add('active');
      }
    }

    // لود تصاویر هر دسته
    async function loadCategoryImages(cat) {
      const container = document.getElementById('birdGallery');
      if (!container) return;
      
      try {
        const res = await fetch("https://toti-ara-gallery.mohammadrezasamieizadeh.workers.dev/api/gallery");
        if (res.ok) {
          const data = await res.json();
          const items = Array.isArray(data) ? data : (data.products || data.data || []);
          const filtered = items.filter(i => (i.category || '').toLowerCase().includes(cat.replace('-', '')));

          if (filtered.length > 0) {
            container.innerHTML = filtered.map(item => `
              <div class="gallery-item">
                <img src="${item.image_url || item.url || 'hero.png'}" alt="${item.title || 'طوطی'}">
                <div class="gallery-item-title">${item.title || item.name || 'طوطی آماده واگذاری'}</div>
              </div>
            `).join('');
          }
        }
      } catch (err) {}
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', handleRoute);

    document.querySelectorAll('.hotspot').forEach(link => {
      link.addEventListener('click', function(e) {
        const targetHref = this.getAttribute('href');
        if (targetHref && targetHref.startsWith('#')) {
          e.preventDefault();
          window.location.hash = targetHref;
          handleRoute();
        }
      });
    });
  </script>
</body>
</html>
