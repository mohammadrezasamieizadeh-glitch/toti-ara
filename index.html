<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرندگان آرا - قزوین</title>
    <!-- Supabase Setup -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        body { background-color: #0b1a0e; color: white; font-family: Tahoma, sans-serif; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; }
        .banner { width: 100%; border-radius: 15px; margin-bottom: 20px; }
        .insta-btn { display: block; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); color: white; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
        .bird-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .bird-card { background: #163620; padding: 15px; border-radius: 12px; cursor: pointer; border: 1px solid #285e35; }
        .bird-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .admin-link { margin-top: 30px; display: block; color: #85e39d; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <img src="hero.png" class="banner" alt="طوطی آرا">
    
    <!-- لینک اینستاگرام همیشه در دسترس -->
    <a href="https://instagram.com/ara_bird_qaz" class="insta-btn" target="_blank">📸 مشاهده پیج اینستاگرام ما</a>

    <h2>پرندگان موجود در سالن</h2>
    <div id="birds-grid" class="bird-section">
        <p>در حال بارگذاری پرندگان...</p>
    </div>

    <a href="admin.html" class="admin-link">⚙️ ورود به پنل مدیریت</a>
</div>

<script>
    async function loadBirds() {
        const grid = document.getElementById('birds-grid');
        try {
            // اتصال مستقیم به دیتابیس (بدون واسطه)
            const { data, error } = await window.supabaseClient
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;
            if (!data || data.length === 0) {
                grid.innerHTML = '<p>هنوز پرنده‌ای ثبت نشده است.</p>';
                return;
            }

            grid.innerHTML = data.map(bird => `
                <div class="bird-card">
                    <img src="${bird.image_url}" alt="${bird.title}">
                    <p>${bird.title}</p>
                </div>
            `).join('');

        } catch (err) {
            grid.innerHTML = '<p>خطا در اتصال به دیتابیس. لطفا دوباره تلاش کنید.</p>';
        }
    }

    // لود خودکار
    loadBirds();
</script>

</body>
</html>
