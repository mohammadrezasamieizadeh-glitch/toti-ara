<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سالن پرورش طوطی آرا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <header class="p-4 md:p-8 text-center">
        <h1 class="text-3xl md:text-4xl font-black text-emerald-400">🦜 سالن پرورش طوطی آرا</h1>
        <p class="text-slate-400 text-sm mt-2">گالری پرندگان و ملزومات — به‌روزرسانی زنده</p>
        <a href="admin.html" class="inline-block mt-3 text-xs bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl transition">پنل مدیریت ↗</a>
    </header>

    <main id="gallery" class="max-w-5xl mx-auto p-4 md:p-8 grid md:grid-cols-3 gap-6"></main>

    <script>
        const SUPABASE_URL = "https://dwrkgqjylmsqbfogwggs.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3cmtncWp5bG1zcWJmb2d3Z2dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNzYzNjksImV4cCI6MjA1NTc1MjM2OX0.nC5k54o18h7fOaY6s78wJm_bK2N9X1mZpQrTuVwXyZ0";

        const CATEGORIES = [
            { id: "خورشیدی (Sun Conure)", name: "طوطی خورشیدی (Sun Conure)", emoji: "🌅" },
            { id: "گرین‌چیک (Green-cheeked)", name: "طوطی گرین‌چیک (Green-cheeked)", emoji: "💚" },
            { id: "راهب (Monk Parakeet)", name: "طوطی راهب (Monk Parakeet)", emoji: "🕊️" },
            { id: "ملزومات و تغذیه", name: "ملزومات و تغذیه", emoji: "🌾" }
        ];

        let client;
        window.addEventListener("DOMContentLoaded", async () => {
            client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            renderSkeleton();
            await loadBirds();
        });

        function renderSkeleton() {
            const g = document.getElementById("gallery");
            g.innerHTML = CATEGORIES.map(c => `
                <section class="bg-slate-800/90 border border-slate-700 rounded-3xl p-5">
                    <h2 class="font-bold text-emerald-400 mb-3">${c.emoji} ${c.name}</h2>
                    <div id="box-${CSS.escape(c.id)}" class="space-y-3">
                        <p class="text-xs text-slate-400">در حال بارگذاری...</p>
                    </div>
                </section>`).join("");
        }

        function esc(s) {
            const d = document.createElement("div");
            d.textContent = s == null ? "" : String(s);
            return d.innerHTML;
        }

        async function loadBirds() {
            let rows = [];
            let err = null;
            try {
                let res = await client.from("birds").select("*").order("created_at", { ascending: false });
                if (res.error) res = await client.from("products").select("*").order("created_at", { ascending: false });
                rows = res.data || [];
                err = res.error;
            } catch (e) { err = e; }

            const g = document.getElementById("gallery");
            if (!rows || rows.length === 0) {
                g.innerHTML = `<div class="md:col-span-3 text-center text-slate-400 bg-slate-800/60 border border-slate-700 rounded-3xl p-10">
                    ${err ? "⚠️ خطا در اتصال به سرور: " + esc(err.message || err) : "هنوز پرنده‌ای ثبت نشده است."}
                </div>`;
                return;
            }

            g.innerHTML = "";
            CATEGORIES.forEach(cat => {
                const items = rows.filter(r => (r.category || "") === cat.id);
                const box = document.getElementById("box-" + CSS.escape(cat.id));
                if (!box) return;
                if (items.length === 0) {
                    box.innerHTML = '<p class="text-xs text-slate-500">فعلاً موردی ثبت نشده است.</p>';
                    return;
                }
                box.innerHTML = items.map(r => `
                    <div class="bg-slate-900/80 border border-slate-700 rounded-2xl overflow-hidden">
                        <img src="${esc(r.image_url)}" alt="${esc(r.title || r.name || "")}" class="w-full h-44 object-cover" loading="lazy">
                        <div class="p-3">
                            <h3 class="font-bold text-sm text-slate-100">${esc(r.title || r.name || "")}</h3>
                            <p class="text-xs text-emerald-400 mt-1">${esc(r.price || "")}</p>
                            <p class="text-xs text-slate-400 mt-1 leading-relaxed">${esc(r.description || "")}</p>
                        </div>
                    </div>`).join("");
            });
        }
    </script>
</body>
</html>
