<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سالن پرورش طوطی آرا قزوین</title>
  <!-- کتابخانه اتصال به دیتابیس Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b150f;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .main-container {
      width: 100%;
      max-width: 480px;
      position: relative;
      background-color: #0b150f;
    }
    .poster-wrapper {
      position: relative;
      width: 100%;
      line-height: 0;
    }
    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
    
    /* هات‌اسپات‌های لمسی */
    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      background: rgba(255, 255, 255, 0.001);
    }

    /* پاپ‌آپ / مودال اطلاعات و گالری */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #122419;
      border: 1px solid #285437;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
    }
    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #1c3826;
      padding-bottom: 10px;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #4ade80;
    }
    .close-btn {
      background: #203e2a;
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    /* گالری پرندگان ثبت شده */
    .bird-gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 15px;
      margin-bottom: 20px;
    }
    .bird-item-card {
      background: #183323;
      border: 1px solid #285437;
      border-radius: 16px;
      overflow: hidden;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bird-item-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 12px;
      background-color: #0b150f;
    }
    .bird-item-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }
    .bird-item-title {
      font-weight: bold;
      color: #fff;
    }
    .bird-item-price {
      color: #facc15;
      font-weight: bold;
    }
    .bird-item-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .loading-text, .empty-text {
      text-align: center;
      padding: 25px 10px;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .btn-insta {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #fff;
    }
    .btn-call {
      background: #16a34a;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="poster-wrapper">
      <img src="hero.png" alt="سالن پرورش طوطی آرا قزوین" class="poster-img">

      <!-- ۱. سه کارت معرفی پرندگان -->
      <!-- کارت سمت چپ: خورشیدی -->
      <div class="hotspot" style="top: 48%; left: 3%; width: 30%; height: 18%;" onclick="openBirdCategory('خورشیدی')"></div>
      <!-- کارت وسط: راهب -->
      <div class="hotspot" style="top: 48%; left: 35%; width: 30%; height: 18%;" onclick="openBirdCategory('راهب')"></div>
      <!-- کارت سمت راست: گرین‌چیک -->
      <div class="hotspot" style="top: 48%; left: 67%; width: 30%; height: 18%;" onclick="openBirdCategory('گرینچیک')"></div>

      <!-- ۲. دکمه‌های تماس و واتساپ پایین پوستر -->
      <a href="tel:09107488013" class="hotspot" style="top: 72%; left: 35%; width: 62%; height: 5%; display: block;" title="تماس"></a>
      <a href="https://wa.me/989107488013" target="_blank" class="hotspot" style="top: 72%; left: 4%; width: 30%; height: 5%; display: block;" title="واتساپ"></a>

      <!-- ۳. آیکون اینستاگرام -->
      <a href="https://www.instagram.com/ara_bird_qaz/" target="_blank" rel="noopener noreferrer" class="hotspot" style="top: 77%; left: 8%; width: 12%; height: 3.5%; display: block;" title="اینستاگرام"></a>

      <!-- ۴. دکمه ورود مدیریت -->
      <a href="admin.html" class="hotspot" style="top: 88%; left: 5%; width: 45%; height: 8%; display: block;" title="ورود مدیریت"></a>
    </div>
  </div>

  <!-- پاپ‌آپ نمایش تصاویر پرندگان پنل ادمین -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">پرندگان موجود</h3>
        <button class="close-btn" onclick="hideModal()">✕</button>
      </div>
      
      <!-- محفظه لود شدن پرنده‌ها از Supabase -->
      <div id="birdsContainer">
        <div class="loading-text">در حال بارگذاری تصاویر و پرندگان...</div>
      </div>
      
      <div class="btn-group">
        <a href="https://www.instagram.com/ara_bird_qaz/" target="_blank" rel="noopener noreferrer" class="btn btn-insta">
          مشاهده پیج اینستاگرام (ara_bird_qaz)
        </a>
        <a href="tel:09107488013" class="btn btn-call">
          تماس جهت خرید و مشاوره: ۰۹۱۰۷۴۸۸۰۱۳
        </a>
      </div>
    </div>
  </div>

  <script>
    // راه‌اندازی کلاینت دیتابیس
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function openBirdCategory(categoryName) {
      document.getElementById('modalTitle').innerText = 'طوطی‌های ' + categoryName + ' سالن آرا';
      const container = document.getElementById('birdsContainer');
      container.innerHTML = '<div class="loading-text">در حال بارگذاری تصاویر...</div>';
      
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.add('active');

      try {
        // خواندن پرنده‌های مربوط به این دسته از دیتابیس
        const { data, error } = await client
          .from('birds')
          .select('*')
          .ilike('category', `%${categoryName}%`)
          .order('id', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = `
            <div class="empty-text">
              <p>در حال حاضر عکسی برای طوطی <strong>${categoryName}</strong> ثبت نشده است.</p>
              <p style="font-size:0.8rem; margin-top:8px; color:#64748b;">(از طریق پنل مدیریت می‌توانید عکس‌های جدید اضافه کنید)</p>
            </div>
          `;
          return;
        }

        // ایجاد کارت برای هر عکس ثبت شده
        let html = '<div class="bird-gallery-grid">';
        data.forEach(bird => {
          html += `
            <div class="bird-item-card">
              <img src="${bird.image_url}" alt="${bird.title || categoryName}" class="bird-item-img" onerror="this.src='hero.png'">
              <div class="bird-item-info">
                <span class="bird-item-title">${bird.title || bird.category}</span>
                <span class="bird-item-price">${bird.price ? bird.price + ' تومان' : 'تماس بگیرید'}</span>
              </div>
              ${bird.description ? `<div class="bird-item-desc">${bird.description}</div>` : ''}
            </div>
          `;
        });
        html += '</div>';

        container.innerHTML = html;

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="empty-text" style="color:#ef4444;">خطا در دریافت اطلاعات. لطفاً اینترنت خود را بررسی کنید.</div>';
      }
    }

    function hideModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') {
        hideModal();
      }
    }
  </script>
</body>
</html>
