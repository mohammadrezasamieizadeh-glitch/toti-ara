<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طوطی آرا | سالن پرورش تخصصی</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        :root {
            --primary: #FFD700; /* طلایی */
            --dark: #001F3F;    /* سرمه‌ای تیره */
            --light: #f4f4f4;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--dark);
            color: white;
            margin: 0;
            line-height: 1.6;
        }
        /* هدر مطابق تصویر */
        header {
            background: linear-gradient(rgba(0,31,63,0.8), rgba(0,31,63,0.8)), url('assets/hero.png');
            background-size: cover;
            background-position: center;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 5px solid var(--primary);
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 50px;
            margin-bottom: 30px;
        }
        .hero-title {
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 2px 2px 10px black;
        }
        /* بخش ویژگی‌ها با آیکون */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
            background: #002d5a;
        }
        .feature-card {
            text-align: center;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 15px;
        }
        /* بخش محصولات (پرندگان) */
        #birds {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 40px;
        }
        .bird-card {
            background: white;
            color: #333;
            border-radius: 20px;
            overflow: hidden;
            transition: 0.3s;
            border: 3px solid var(--primary);
        }
        .bird-card img { width: 100%; height: 200px; object-fit: cover; }
        .bird-card-content { padding: 15px; }
        .btn-order {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
    </style>
</head>
<body>

<header id="home">
    <div class="nav-bar">
        <span>صفحه اصلی</span>
        <span>درباره ما</span>
        <span>پرندگان</span>
        <span>تماس با ما</span>
    </div>
    <h1 class="hero-title">سالن پرورش طوطی آرا</h1>
    <p>پرورش حرفه‌ای • عشق به پرندگان</p>
    <p>📍 قزوین، محله مینودر</p>
</header>

<div class="features">
    <div class="feature-card">🛡️ سلامت تضمینی</div>
    <div class="feature-card">🥚 تخم و جوجه</div>
    <div class="feature-card">🤲 تغذیه اصولی</div>
    <div class="feature-card">🏠 محیط استاندارد</div>
</div>

<div id="birds">
    <!-- محصولات از دیتابیس اینجا لود می‌شوند -->
</div>

<!-- فرم سفارش واتساپ مشابه کد قبلی شما -->
