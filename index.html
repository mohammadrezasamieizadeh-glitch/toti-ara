<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طوطی آرا</title>
<style>
:root{--ink:#10241e;--paper:#fbfaf5;--accent:#b56b2c;--line:#d9d0c1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:var(--paper);font-family:Tahoma,"Segoe UI",Arial,sans-serif}body.modal-open{overflow:hidden}.hero-stage{position:relative;width:100%;line-height:0;background:#111;overflow:hidden}.hero-stage img{display:block;width:100%;height:auto}.hotspot{position:absolute;z-index:2;display:block;padding:0;margin:0;border:0;background:transparent;cursor:pointer;line-height:1;transform:translate(-50%,-50%);min-width:7%;min-height:5%;color:transparent}.hotspot:focus-visible{outline:3px solid #f4d27a;outline-offset:4px;background:rgba(255,255,255,.12)}.modal{position:fixed;inset:0;z-index:10;background:rgba(8,19,16,.78);display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.panel{width:min(780px,100%);max-height:min(90vh,760px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:25px;border-radius:6px;direction:rtl;line-height:1.9;box-shadow:0 18px 80px #0008}.panel h1{margin:0 0 10px;color:var(--accent);font-size:clamp(21px,4vw,32px)}.panel p{margin:8px 0;color:#33443e}.close{float:left;border:1px solid #b7aa98;background:transparent;color:var(--ink);font-size:22px;width:38px;height:38px;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}.gallery figure{margin:0;border:1px solid var(--line);padding:8px;background:#fff}.gallery img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.gallery figcaption{font-size:12px;margin-top:5px}.empty{padding:24px 8px;text-align:center;color:#65726c}@media(max-width:600px){.hotspot{min-width:10%;min-height:7%}.panel{padding:17px}}
</style></head>
<body>
<main class="hero-stage" id="heroStage"><img id="hero" src="hero.png" alt="طوطی آرا؛ پرورش تخصصی طوطی" decoding="async">
<nav aria-label="ناوبری اصلی">
<button type="button" class="hotspot" style="left:74%;top:3%" data-route="#home" aria-label="خانه">خانه</button><button type="button" class="hotspot" style="left:61%;top:3%" data-route="#about" aria-label="درباره ما">درباره ما</button><button type="button" class="hotspot" style="left:50%;top:3%" data-route="#birds" aria-label="پرندگان">پرندگان</button><button type="button" class="hotspot" style="left:39%;top:3%" data-route="#gallery" aria-label="گالری">گالری</button><button type="button" class="hotspot" style="left:28%;top:3%" data-route="#care" aria-label="نگهداری">نگهداری</button><button type="button" class="hotspot" style="left:18%;top:3%" data-route="#contact" aria-label="تماس با ما">تماس</button><button type="button" class="hotspot" style="left:8%;top:3%" data-route="#quick-contact" aria-label="تماس سریع">تماس سریع</button>
</nav>
<button type="button" class="hotspot" style="left:13%;top:76%" data-route="#gallery/sun" aria-label="مشاهده تصاویر خورشیدی">مشاهده تصاویر خورشیدی</button><button type="button" class="hotspot" style="left:37%;top:76%" data-route="#gallery/monk" aria-label="مشاهده تصاویر راهب">مشاهده تصاویر راهب</button><button type="button" class="hotspot" style="left:59%;top:76%" data-route="#gallery/green-cheek" aria-label="مشاهده تصاویر گرین چیک">مشاهده تصاویر گرین چیک</button><button type="button" class="hotspot" style="left:45%;top:83%" data-route="#gallery" aria-label="مشاهده گالری و تصاویر">مشاهده گالری</button><button type="button" class="hotspot" style="left:78%;top:52%" data-route="#about" aria-label="درباره طوطی آرا">درباره</button><button type="button" class="hotspot" style="left:22%;top:94%" data-route="#contact" aria-label="شماره تماس و پشتیبانی">شماره تماس</button>
</main>
<section class="modal" id="modal" hidden aria-modal="true" role="dialog"><article class="panel"><button type="button" class="close" id="close" aria-label="بستن">×</button><div id="content"></div></article></section>
<script src="supabase-config.js"></script><script>
const modal=document.querySelector('#modal'),content=document.querySelector('#content'),close=document.querySelector('#close');let client=null,lastFocus=null;
if(window.supabase&&window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&!/YOUR_|PASTE|example/i.test(window.SUPABASE_URL+window.SUPABASE_ANON_KEY))client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const copy={about:['درباره طوطی آرا','در طوطی آرا، انتخاب یک هم‌نشین دوست‌داشتنی با اطلاعات درست و پشتیبانی واقعی همراه است.'],birds:['پرندگان','پرندگان موجود و اطلاعات آن‌ها را در گالری ببینید.'],care:['نگهداری','راهنمای تغذیه، بهداشت و نگهداری پرندگان را از کارشناسان دریافت کنید.'],contact:['تماس با ما','برای انتخاب پرنده، ثبت سفارش و پرسش‌های نگهداری با ما در تماس باشید.'], 'quick-contact':['تماس سریع','برای دریافت مشاوره با ما تماس بگیرید.']};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function products(){if(!client)return[];let {data,error}=await client.from('products').select('id,name,description,available').eq('available',true);if(error)throw error;let ids=(data||[]).map(x=>x.id);let imgs=[];if(ids.length){let r=await client.from('product_images').select('product_id,image_url,sort_order').in('product_id',ids).order('sort_order');if(!r.error)imgs=r.data||[]}return(data||[]).map(p=>({...p,images:imgs.filter(i=>i.product_id===p.id).map(i=>i.image_url).filter(Boolean)}))}
async function show(route){lastFocus=document.activeElement;let key=route.slice(1),species=key.split('/')[1];if(!key){modal.hidden=true;document.body.classList.remove('modal-open');return}modal.hidden=false;document.body.classList.add('modal-open');content.innerHTML='<p>در حال بارگذاری...</p>';if(species){try{let ps=await products();let aliases={sun:['خورشیدی','sun'],monk:['راهب','monk'], 'green-cheek':['گرین','گرین‌چیک','green-cheek']};let p=ps.find(x=>aliases[species]?.some(a=>x.name.toLowerCase().includes(a.toLowerCase())));renderGallery(p?[p]:[],p?.name||'گالری پرنده')}catch(e){renderEmpty('اتصال به Supabase برقرار نیست یا داده‌ای در دسترس نیست.')}}else if(key==='gallery'){try{renderGallery(await products(),'گالری تصاویر')}catch(e){renderEmpty('اتصال به Supabase برقرار نیست یا داده‌ای در دسترس نیست.')}}else{let v=copy[key]||copy.about;content.innerHTML='<h1>'+esc(v[0])+'</h1><p>'+esc(v[1])+'</p>'}}
function renderEmpty(title){content.innerHTML='<h1>'+esc(title)+'</h1><p class="empty">تصویری برای نمایش پیدا نشد. پس از اتصال Supabase و افزودن محصولات، تصاویر اینجا نمایش داده می‌شوند.</p>'}
function renderGallery(ps,title){let all=ps.flatMap(p=>p.images.map(url=>({url,name:p.name})));content.innerHTML='<h1>'+esc(title)+'</h1>'+(all.length?'<div class="gallery">'+all.map(x=>'<figure><img src="'+esc(x.url)+'" alt="'+esc(x.name)+'"><figcaption>'+esc(x.name)+'</figcaption></figure>').join('')+'</div>':'<p class="empty">هنوز تصویری در گالری ثبت نشده است.</p>')}
function route(){show(location.hash||'#home')}document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>location.hash=b.dataset.route));close.addEventListener('click',()=>location.hash='#home');modal.addEventListener('click',e=>{if(e.target===modal)location.hash='#home'});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)location.hash='#home'});addEventListener('hashchange',route);document.querySelector('#hero').addEventListener('load',()=>{document.querySelector('#heroStage').style.aspectRatio='auto'});route();
</script></body></html>
