<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آرا | پوستر</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080908}body{font-family:Tahoma,Arial,sans-serif}.stage{position:relative;width:min(1080px,100vw);margin:0 auto;line-height:0}.stage img{display:block;width:100%;height:auto;max-width:100%;user-select:none}.hotspot{position:absolute;display:block;border:0;padding:0;margin:0;background:transparent;cursor:pointer;z-index:2}.hotspot:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:3px}.nav{top:1%;height:7.5%}.quick{left:2%;width:16%}.contact{left:18%;width:14%}.care{left:32%;width:14%}.gallery{left:46%;width:15%}.birds{left:61%;width:11%}.about{left:72%;width:12%}.home{left:84%;width:14%}.sun{left:5%;top:72%;width:20%;height:8%}.monk{left:28%;top:72%;width:20%;height:8%}.green{left:51%;top:72%;width:20%;height:8%}.gallery-strip{left:5%;top:79%;width:68%;height:11%;z-index:1}.about-panel{left:74%;top:51%;width:24%;height:27%;z-index:1}.phone{left:7%;top:91%;width:45%;height:6%;z-index:1}
.dialog-layer{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.42);z-index:10;padding:14px}.dialog{direction:rtl;width:min(720px,calc(100% - 28px));max-height:min(70svh,600px);overflow:auto;background:#171a18;color:#f5f1e8;border:1px solid #73786e;border-radius:8px;box-shadow:0 18px 60px #000;line-height:1.8}.dialog-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #3b403b;position:sticky;top:0;background:#171a18}.dialog h1{font-size:25px;margin:0;flex:1;line-height:1.3}.close{order:2;flex:none;width:44px;height:44px;border:1px solid #a8afa5;border-radius:4px;background:#252a25;color:#fff;font-size:25px;cursor:pointer}.body{padding:14px;font-size:17px}.body a{color:#f3cb6d}.empty{border:1px dashed #818980;padding:14px;border-radius:6px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.grid figure{margin:0;border:1px solid #50574f;border-radius:6px;overflow:hidden;background:#222722}.grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.grid figcaption{padding:5px;font-size:13px;line-height:1.4}@media(max-width:600px){.dialog h1{font-size:25px}.body{font-size:17px}.dialog-layer{padding:8px}}
</style></head><body>
<main class="stage" id="stage"><img id="hero" src="hero.png" alt="پوستر آرا" draggable="false">
<button class="hotspot nav quick" data-route="quick-contact" aria-label="تماس سریع"></button><button class="hotspot nav contact" data-route="contact" aria-label="تماس"></button><button class="hotspot nav care" data-route="care" aria-label="مراقبت"></button><button class="hotspot nav gallery" data-route="gallery" aria-label="گالری"></button><button class="hotspot nav birds" data-route="birds" aria-label="پرندگان"></button><button class="hotspot nav about" data-route="about" aria-label="درباره ما"></button><button class="hotspot nav home" data-route="home" aria-label="خانه"></button>
<button class="hotspot sun" data-route="gallery/sun" aria-label="گالری خورشیدی"></button><button class="hotspot monk" data-route="gallery/monk" aria-label="گالری راهب"></button><button class="hotspot green" data-route="gallery/green-cheek" aria-label="گالری گرین چیک"></button><button class="hotspot gallery-strip" data-route="gallery" aria-label="گالری"></button><button class="hotspot about-panel" data-route="about" aria-label="درباره ما"></button><a class="hotspot phone" href="tel:09107488013" aria-label="تماس تلفنی"></a></main><div id="overlay" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const hero=document.querySelector('#hero');let intrinsic={w:0,h:0};hero.addEventListener('load',()=>{intrinsic={w:hero.naturalWidth,h:hero.naturalHeight};document.documentElement.dataset.posterSize=intrinsic.w+'x'+intrinsic.h});
const copy={about:['درباره آرا','آرا همراه شما برای نگهداری و انتخاب بهتر پرندگان خانگی است. سلامت، آرامش و کیفیت زندگی پرنده برای ما اولویت دارد.'],care:['مراقبت از پرنده','محیط آرام، آب تازه، غذای متنوع و مراجعهٔ منظم به دامپزشک پرندگان، پایهٔ مراقبت درست است. هر پرنده نیازهای مخصوص خود را دارد.'],contact:['تماس با آرا','برای پرسش، سفارش یا هماهنگی با ما در تماس باشید.<br><br><a href="tel:09107488013">تماس: ۰۹۱۰۷۴۸۸۰۱۳</a><br><a href="https://wa.me/989107488013" target="_blank" rel="noopener">گفت‌وگو در واتساپ</a>'],"quick-contact":['تماس سریع','برای تماس مستقیم با آرا از شمارهٔ زیر استفاده کنید:<br><br><a href="tel:09107488013">۰۹۱۰۷۴۸۸۰۱۳</a><br><a href="https://wa.me/989107488013" target="_blank" rel="noopener">واتساپ</a>'],birds:['پرندگان آرا','در این بخش گونه‌ها و اطلاعات ثبت‌شده در گالری نمایش داده می‌شود. اطلاعات محصولات از پایگاه داده خوانده می‌شود.']};
const species={sun:['خورشیدی','خورشیدی','sun','conure'],monk:['راهب','راهب','monk'], 'green-cheek':['گرین چیک','گرین|گرین چیک|green|conure','green-cheek']};
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function client(){return window.supabaseClient||null} async function rows(route){const c=client();if(!c)return {items:[],msg:'گالری فعلاً تصویری برای نمایش ندارد.'};try{let q=c.from('products').select('id,name,description,price,image_url,emoji,available');let data=(await q).data||[];if(route!=='gallery'){const keys=species[route]?.[1]?.split('|')||[];if(keys.length)data=data.filter(p=>keys.some(k=>(p.name||'').toLowerCase().includes(k.toLowerCase())))}let imgs=(await c.from('product_images').select('product_id,image_url,caption')).data||[];let out=[];data.forEach(p=>{if(p.image_url)out.push({url:p.image_url,name:p.name});imgs.filter(i=>i.product_id===p.id).forEach(i=>out.push({url:i.image_url,name:i.caption||p.name}))});return {items:out,msg:out.length?'':'تصویری برای نمایش در این بخش ثبت نشده است.'}}catch(e){console.warn('[آرا] gallery request failed',e);return {items:[],msg:'دریافت تصاویر فعلاً ممکن نشد؛ بعداً دوباره تلاش کنید.'}}
}
async function show(route){if(route==='home')return close();if(route==='quick-contact'){if(location.hash==='#quick-contact')return modal(...copy[route]);return}if(copy[route])return modal(...copy[route]);if(route.startsWith('gallery')){const key=route.split('/')[1]||'gallery';const title=key==='gallery'?'گالری':(species[key]?.[0]||'گالری');modal(title,'<div class="empty">در حال دریافت تصاویر...</div>');const r=await rows(key);const html=r.items.length?'<div class="grid">'+r.items.map(i=>`<figure><img src="${esc(i.url)}" alt="${esc(i.name)}" onerror="this.closest('figure').remove()"><figcaption>${esc(i.name)}</figcaption></figure>`).join('')+'</div>':`<div class="empty">${r.msg}</div>`;document.querySelector('.body').innerHTML=html}}
function modal(title,body){const o=document.querySelector('#overlay');o.hidden=false;o.innerHTML=`<div class="dialog-layer" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><button class="close" aria-label="بستن">×</button><h1 id="dialog-title">${title}</h1></header><div class="body">${body}</div></section></div>`;o.querySelector('.close').onclick=()=>{location.hash='#home'};o.querySelector('.dialog-layer').onclick=e=>{if(e.target===e.currentTarget)location.hash='#home'};o.querySelector('.close').focus()}
function close(){const o=document.querySelector('#overlay');o.hidden=true;o.innerHTML=''}function route(){show((location.hash||'#home').slice(1)||'home')}document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{location.hash='#'+b.dataset.route});addEventListener('hashchange',route);addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('#overlay').hidden)location.hash='#home'});route();
</script></body></html>
