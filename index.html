<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سالن پرورش طوطی آرا قزوین</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b150f;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .main-container {
      width: 100%;
      max-width: 480px;
      position: relative;
      background-color: #0b150f;
    }
    .poster-wrapper {
      position: relative;
      width: 100%;
      line-height: 0;
    }
    .poster-img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    /* هات‌اسپات‌های لمسی دقیق */
    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      background: rgba(255, 255, 255, 0.001); /* کاملاً شفاف */
    }

    /* پاپ‌آپ / مودال اطلاعات */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #122419;
      border: 1px solid #285437;
      border-radius: 22px 22px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px 20px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
    }
    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #1c3826;
      padding-bottom: 10px;
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #4ade80;
    }
    .close-btn {
      background: #203e2a;
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .modal-body {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #e5e7eb;
    }
    .modal-body ul {
      padding-right: 18px;
      margin: 10px 0;
    }
    .modal-body li {
      margin-bottom: 6px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .btn-insta {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #fff;
    }
    .btn-call {
      background: #16a34a;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="poster-wrapper">
      <img src="hero.png" alt="سالن پرورش طوطی آرا" class="poster-img">

      <!-- ۱. فقط لوگوی گرد بالا برای ورود به پنل مدیریت -->
      <a href="admin.html" class="hotspot" style="top: 1.5%; left: 38%; width: 24%; height: 8%; display: block;" title="ورود مدیریت"></a>

      <!-- ۲. طوطی‌های روی شاخه بالای پوستر -->
      <!-- گرین‌چیک (سمت چپ شاخه) -->
      <div class="hotspot" style="top: 11%; left: 5%; width: 28%; height: 22%;" onclick="openModal('greencheek')"></div>
      <!-- راهب (وسط شاخه) -->
      <div class="hotspot" style="top: 11%; left: 36%; width: 28%; height: 22%;" onclick="openModal('monk')"></div>
      <!-- خورشیدی (سمت راست شاخه) -->
      <div class="hotspot" style="top: 11%; left: 67%; width: 28%; height: 22%;" onclick="openModal('sunconure')"></div>

      <!-- ۳. دایره‌های چهارگانه ویژگی‌ها (اصالت، تغذیه، سلامت، مشاوره) -->
      <div class="hotspot" style="top: 36%; left: 4%; width: 22%; height: 8%;" onclick="openModal('info_parent')"></div>
      <div class="hotspot" style="top: 36%; left: 28%; width: 22%; height: 8%;" onclick="openModal('info_ring')"></div>
      <div class="hotspot" style="top: 36%; left: 51%; width: 22%; height: 8%;" onclick="openModal('info_health')"></div>
      <div class="hotspot" style="top: 36%; left: 74%; width: 22%; height: 8%;" onclick="openModal('info_feed')"></div>

      <!-- ۴. کادرهای ۳ تایی پرندگان پایین پوستر -->
      <!-- کارت گرین‌چیک (سمت چپ) -->
      <div class="hotspot" style="top: 48%; left: 4%; width: 30%; height: 21%;" onclick="openModal('greencheek')"></div>
      <!-- کارت راهب (وسط) -->
      <div class="hotspot" style="top: 48%; left: 35%; width: 30%; height: 21%;" onclick="openModal('monk')"></div>
      <!-- کارت خورشیدی (سمت راست) -->
      <div class="hotspot" style="top: 48%; left: 66%; width: 30%; height: 21%;" onclick="openModal('sunconure')"></div>

      <!-- ۵. نوار اینستاگرام در پایین پوستر (لمس مستقیم باز شدن اینستاگرام) -->
      <a href="https://www.instagram.com/ara_bird_qaz/" target="_blank" rel="noopener noreferrer" class="hotspot" style="top: 86%; left: 5%; width: 90%; height: 7%; display: block;" title="اینستاگرام"></a>

      <!-- ۶. نوار تماس با ما در انتهای پوستر -->
      <a href="tel:09120000000" class="hotspot" style="top: 93%; left: 5%; width: 90%; height: 6%; display: block;" title="تماس"></a>
    </div>
  </div>

  <!-- پنجره پاپ‌آپ محتوا -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">عنوان</h3>
        <button class="close-btn" onclick="hideModal()">✕</button>
      </div>
      <div class="modal-body" id="modalContent"></div>
      
      <div class="btn-group">
        <a href="https://www.instagram.com/ara_bird_qaz/" target="_blank" rel="noopener noreferrer" class="btn btn-insta">
          مشاهده پیج اینستاگرام (ara_bird_qaz)
        </a>
        <a href="tel:09120000000" id="callBtn" class="btn btn-call">
          تماس جهت استعلام موجودی
        </a>
      </div>
    </div>
  </div>

  <script>
    const birdData = {
      sunconure: {
        title: "طوطی سان کانور (خورشیدی)",
        desc: `
          <p>طوطی سان کانور با: 90%; height: 6%; display: block;" title="تماس"></a>
    </div>
  </div>

  <!-- پنجره پاپ‌آپ محتوا -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">عنوان</h3>
        <button class="close-btn" onclick="hideModal()">✕</button>
      </div>
      <div class="modal-body" id="modalContent"></div>
      
      <div class="btn-group">
        <a href="https://www.instagram.com/ara_bird_qaz/" target="_blank" rel="noopener noreferrer" class="btn btn-insta">
          مشاهده پیج اینستاگرام (ara_bird_qaz)
        </a>
        <a href="tel:09120000000" id="callBtn" class="btn btn-call">
          تماس جهت استعلام موجودی
        </a>
      </div>
    </div>
  </div>

  <script>
    const birdData = {
      sunconure: {
        title: "طوطی سان کانور (خورشیدی)",
        desc: `
          <p>طوطی سان کانور با رنگ‌های درخشان زرد و نارنجی، پرانرژی‌ترین و باهوش‌ترین طوطی برای نگهداری است.</p>
          <ul>
            <li><strong>خصوصیات:</strong> فوق‌العاده بازیگوش، کاملاً دستی و وابسته، یادگیری ترفندهای هوشی</li>
            <li><strong>وضعیت سالن:</strong> پرورش کاملاً بهداشتی با مکمل‌های اورجینال اروپایی</li>
            <li><strong>موجودی:</strong> سرلاکی، دون‌خور و بالغ حلقه پا</li>
          </ul>
        `
      },
      monk: {
        title: "طوطی راهب (کواکر)",
        desc: `
          <p>طوطی راهب یکی از قوی‌ترین طوطی‌های سایز متوسط در یادگیری و تقلید صدای انسان و حرکات نمایشی است.</p>
          <ul>تغذیه و سرلاک معتبر",
        desc: "<p>تغذیه اصولی با سرلاک‌های معتبر دنیا (A19 و A21 ورسله‌لاگا) به همراه پلت‌های غنی‌شده، جوانه‌ها و سبزیجات تازه جهت سلامت دستگاه گوارش پرندگان انجام می‌گیرد.</p>"
      },
      info_ring: {
        title: "حلقه پای اختصاصی",
        desc: "<p>تمامی جوجه‌های مجموعه دارای حلقه پای فلزی بسته اختصاصی سالن آرا با درج کد سالن و سال تولید هستند که سند اصالت پرنده است.</p>"
      },
      info_parent: {
        title: "مولدین اصیل و درشت",
        desc: "<p>جوجه‌ها از والدینی با جثه کشیده، سینه پر و بدون نسبت فامیلی به دنیا آمده‌اند تا بیشترین مقاومت بدنی را داشته باشند.</p>"
      }
    };

    function openModal(type) {
      const data = birdData[type];
      if (!data) return;

      document.getElementById('modalTitle').innerText = data.title;
      document.getElementById('modalContent').innerHTML = data.desc;
      
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.add('active');
    }

    function hideModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') {
        hideModal();
      }
    }
  </script>
</body>
</html>
