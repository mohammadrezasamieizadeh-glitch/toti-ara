<div id="login-box" class="card">
  <h2>ورود به پنل مدیریت</h2>
  <div class="form-group">
    <label>رمز عبور مدیریت</label>
    <input type="password" id="admin-pass" placeholder="رمز عبور را وارد کنید">
  </div>
  <button onclick="loginWithPassword()" class="btn">ورود</button>
  <p id="login-error" style="color: #ff6b6b; margin-top: 10px; display: none;">رمز عبور اشتباه است.</p>
</div>
