<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت آرا</title><style>body{font-family:Tahoma,Arial;max-width:900px;margin:auto;padding:18px;background:#101310;color:#eee;line-height:1.8}section{border:1px solid #485047;padding:14px;margin:12px 0;border-radius:6px}input,textarea,button,select{font:inherit;padding:9px;margin:4px;border-radius:4px;border:1px solid #687268;background:#1d231e;color:#fff}input,textarea{width:100%}button{cursor:pointer}h1{font-size:25px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #394139;padding:7px;text-align:right}</style></head><body><h1>پنل مدیریت آرا</h1><section><h2>ورود / ثبت‌نام</h2><input id="email" type="email" placeholder="ایمیل"><input id="password" type="password" placeholder="رمز عبور"><button id="signup">ثبت‌نام</button><button id="signin">ورود</button><button id="signout">خروج</button><p id="authmsg"></p></section><section><h2>محصول</h2><input id="pid" type="hidden"><input id="name" placeholder="نام"><textarea id="desc" placeholder="توضیحات"></textarea><input id="price" placeholder="قیمت"><input id="image_url" placeholder="نشانی تصویر"><label>تصویر محصول <input id="file" type="file" accept="image/*"></label><button id="save">ذخیره</button><div id="products"></div></section><section><h2>بخش‌های سایت</h2><input id="skey" placeholder="کلید مثل about"><input id="stitle" placeholder="عنوان"><textarea id="sbody" placeholder="متن"></textarea><button id="sectionSave">ذخیره بخش</button></section><p id="sdkmsg" role="status"></p><script>
(function () {
  var urls = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  function load(i) {
    if (window.supabase && typeof window.supabase.createClient === 'function') return start();
    if (i >= urls.length) return start();
    var s = document.createElement('script'); s.src = urls[i]; s.async = true;
    s.onload = function () { load(i + 1); }; s.onerror = function () { load(i + 1); };
    document.head.appendChild(s);
  }
  function start() {
    var config = document.createElement('script'); config.src = 'supabase-config.js';
    config.onload = function () { window.dispatchEvent(new Event('supabase-config-ready')); };
    config.onerror = function () { document.getElementById('sdkmsg').textContent = 'فایل supabase-config.js بارگذاری نشد؛ فایل‌های پروژه را کامل جایگزین کنید.'; };
    document.head.appendChild(config);
  }
  window.addEventListener('supabase-config-ready', function () {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      document.getElementById('sdkmsg').textContent = 'کتابخانه رسمی Supabase از هیچ‌یک از CDNها بارگذاری نشد. اتصال پنل مدیریت ممکن نیست؛ شبکه یا مسدودکننده CDN را بررسی کنید.';
    }
    var script = document.createElement('script'); script.textContent = document.getElementById('admin-code').textContent; document.body.appendChild(script);
  });
  load(0);
})();
</script><script type="text/plain" id="admin-code">const c=window.supabaseClient;const $=id=>document.getElementById(id);function msg(x){$('authmsg').textContent=x}if(!c||typeof c.auth?.signInWithPassword!=='function'){msg('پنل مدیریت به کتابخانه رسمی Supabase نیاز دارد؛ CDNها در دسترس نیستند. صفحه عمومی همچنان با REST کار می‌کند.');}async function auth(fn){if(!c)return msg('ابتدا supabase-config.js را تنظیم کنید.');let r=await fn();msg(r.error?.message||'انجام شد')}$('signup').onclick=()=>auth(()=>c.auth.signUp({email:$('email').value,password:$('password').value}));$('signin').onclick=()=>auth(()=>c.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('signout').onclick=()=>auth(()=>c.auth.signOut());async function load(){if(!c)return;$('products').innerHTML='در حال دریافت...';let r=await c.from('products').select('*').order('name');$('products').innerHTML='<table><tr><th>نام</th><th>عملیات</th></tr>'+(r.data||[]).map(p=>`<tr><td>${p.name}</td><td><button onclick='edit(${JSON.stringify(p)})'>ویرایش</button><button onclick='del("${p.id}")'>حذف</button></td></tr>`).join('')+'</table>'}window.edit=p=>{['id','name','description','price','image_url'].forEach(k=>$(k==='id'?'pid':k).value=p[k]||'')};window.del=async id=>{if(c)await c.from('products').delete().eq('id',id);load()};$('save').onclick=async()=>{if(!c)return msg('تنظیمات اتصال ناقص است.');let id=$('pid').value,p={name:$('name').value,description:$('desc').value,price:$('price').value,image_url:$('image_url').value,available:true};let r=id?await c.from('products').update(p).eq('id',id).select().single():await c.from('products').insert(p).select().single();if($('file').files[0]&&r.data){let f=$('file').files[0],path=Date.now()+'-'+f.name;let u=await c.storage.from('product-images').upload(path,f);if(!u.error){let pub=c.storage.from('product-images').getPublicUrl(path).data.publicUrl;await c.from('product_images').insert({product_id:r.data.id,image_url:pub,caption:f.name})}}load()};$('sectionSave').onclick=async()=>{if(c)await c.from('site_sections').upsert({key:$('skey').value,title:$('stitle').value,body:$('sbody').value,updated_at:new Date().toISOString()});};load()</script></body></html>
