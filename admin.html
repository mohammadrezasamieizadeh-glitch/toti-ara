<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | سالن طوطی آرا</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #081a15;
      color: #e2f0ea;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #0c231c;
      border: 1px solid #1f4e3e;
      border-radius: 16px;
      padding: 24px;
    }
    h1 { color: #ffd15c; font-size: 1.5rem; margin-bottom: 20px; text-align: center; }
    .card { background: #081a15; border: 1px solid #1a3d31; border-radius: 12px; padding: 18px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #a3c9bb; }
    input, textarea, select {
      width: 100%; padding: 10px 14px; background: #05120e; border: 1px solid #1f4e3e;
      border-radius: 8px; color: #fff; font-family: inherit; margin-bottom: 14px;
    }
    select { background: #05120e; color: #e2f0ea; }
    button {
      background: linear-gradient(135deg, #ffd15c, #f39c12); color: #0c231c; border: none;
      padding: 12px 20px; border-radius: 8px; font-weight: 800; font-family: inherit;
      cursor: pointer; width: 100%; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .product-list { margin-top: 20px; }
    .product-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #05120e; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #1a3d31;
    }
    .del-btn { width: auto; background: #e74c3c; color: #fff; padding: 6px 12px; font-size: 0.8rem; }
    .logout-btn {
      background: #2a3b34; color: #ffd15c; border: 1px solid #3d594d;
      margin-top: 15px; width: auto; padding: 8px 16px; float: left;
    }
    .logout-btn:hover { background: #3d594d; }
  </style>
</head>
<body>
  <div class="container">
    <h1>پنل مدیریت پرندگان و محصولات طوطی آرا</h1>
    
    <!-- فرم ورود فقط با رمز عبور -->
    <div id="authSection" class="card">
      <h2 style="font-size:1.1rem;margin-bottom:12px;color:#ffd15c;">ورود مدیر</h2>
      <label for="adminPassword">رمز عبور مدیریت:</label>
      <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کنید" onkeydown="if(event.key==='Enter') login()">
      <button onclick="login()">ورود به پنل</button>
    </div>

    <!-- بخش داشبورد مدیریت -->
    <div id="dashboardSection" style="display:none;">
      <div style="overflow: hidden; margin-bottom: 15px;">
        <button class="logout-btn" onclick="logout()">خروج از حساب</button>
      </div>

      <div class="card">
        <h2 style="font-size:1.1rem;margin-bottom:12px;color:#ffd15c;">افزودن پرنده جدید</h2>
        <label>نام پرنده و نژاد:</label>
        <input type="text" id="pName" placeholder="مثال: جوجه گرین چیک آناناسی">
        
        <label for="pCategory">دسته‌بندی پرنده:</label>
        <select id="pCategory">
          <option value="green-cheek" selected>🦜 گرین چیک</option>
          <option value="monk">🦜 راهب</option>
          <option value="sun">🦜 خورشیدی</option>
        </select>

        <label>قیمت / وضعیت:</label>
        <input type="text" id="pPrice" placeholder="مثال: توافقی / موجود">
        
        <label>آدرس عکس (URL):</label>
        <input type="text" id="pImg" placeholder="https://...">
        
        <label>توضیحات کوتاه:</label>
        <textarea id="pDesc" rows="3" placeholder="توضیحات سن، دستی بودن، سلامت..."></textarea>
        
        <button onclick="addProduct()">➕ ثبت در پایگاه داده</button>
      </div>

      <div class="card">
        <h2 style="font-size:1.1rem;margin-bottom:12px;color:#ffd15c;">لیست پرندگان ثبت‌شده</h2>
        <div id="productList" class="product-list">در حال دریافت لیست...</div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASS = 'ara123';
    let client = window.supabaseClient;

    // بررسی ورود قبلی از طریق sessionStorage
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('ara_admin_auth') === 'true') {
        showDashboard();
      }
    });

    function login() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === ADMIN_PASS) {
        sessionStorage.setItem('ara_admin_auth', 'true');
        showDashboard();
      } else {
        alert('رمز عبور اشتباه است!');
      }
    }

    function logout() {
      sessionStorage.removeItem('ara_admin_auth');
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('adminPassword').value = '';
    }

    function showDashboard() {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      loadAdminProducts();
    }

    async function loadAdminProducts() {
      if (!client) {
        document.getElementById('productList').innerHTML = 'خطا در بارگذاری ارتباط پایگاه داده.';
        return;
      }
      const { data, error } = await client.from('products').select('*').order('id', { ascending: false });
      const list = document.getElementById('productList');
      if (error) { list.innerHTML = 'خطا در دریافت لیست.'; return; }
      if (!data || data.length === 0) { list.innerHTML = 'هیچ محصولی ثبت نشده است.'; return; }
      list.innerHTML = data.map(p => `
        <div class="product-row">
          <div><strong>${p.name}</strong> - <span>${p.price || 'بدون قیمت'}</span></div>
          <button class="del-btn" onclick="deleteProduct(${p.id})">حذف</button>
        </div>
      `).join('');
    }

    async function addProduct() {
      const name = document.getElementById('pName').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const image_url = document.getElementById('pImg').value.trim();
      const description = document.getElementById('pDesc').value.trim();
      const category = document.getElementById('pCategory').value;

      if (!name) { alert('نام پرنده الزامی است'); return; }
      
      const { error } = await client.from('products').insert([{
        name,
        price,
        image_url,
        description,
        available: true,
        category
      }]);

      if (error) {
        alert('خطا در ثبت: ' + error.message);
      } else {
        alert('با موفقیت ثبت شد!');
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pImg').value = '';
        document.getElementById('pDesc').value = '';
        loadAdminProducts();
      }
    }

    async function deleteProduct(id) {
      if (!confirm('آیا از حذف این مورد اطمینان دارید؟')) return;
      const { error } = await client.from('products').delete().eq('id', id);
      if (error) alert('خطا در حذف: ' + error.message);
      else loadAdminProducts();
    }
  </script>
</body>
</html>
