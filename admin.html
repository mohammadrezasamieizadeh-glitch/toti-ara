<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | طوطی آرا</title>
  <!-- فونت و آیکون‌ها -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- کتابخانه Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- فایل تنظیمات اتصال به Supabase -->
  <script src="supabase-config.js"></script>

  <style>
    :root {
      --primary: #0f5132;
      --primary-light: #198754;
      --gold: #d4af37;
      --gold-dark: #b89628;
      --dark: #1e293b;
      --light-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #334155;
      --danger: #ef4444;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--light-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* هدر */
    header {
      background: linear-gradient(135deg, var(--primary), #0a3622);
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-logout {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .btn-logout:hover {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* محفظه اصلی */
    .container {
      max-width: 900px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* کارت‌ها */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
      margin-bottom: 2rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.75rem;
    }

    /* فرم ورود */
    #loginSection {
      max-width: 420px;
      margin: 4rem auto;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--dark);
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
      background: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    /* دکمه آپلود فایل اختصاصی برای موبایل و دسکتاپ */
    .file-drop-area {
      border: 2px dashed var(--gold);
      background: #fffdf5;
      padding: 1.5rem 1rem;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }

    .file-drop-area:hover {
      background: #fbf6e6;
    }

    .file-drop-area input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-label {
      font-size: 0.95rem;
      color: var(--dark);
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .file-subtext {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 400;
    }

    /* پیش‌نمایش تصویر */
    .preview-box {
      margin-top: 12px;
      display: none;
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border);
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* دکمه‌های اصلی */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
      transition: 0.2s;
    }

    .btn-submit:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* جدول / لیست محصولات */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .prod-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .prod-thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #f1f5f9;
    }

    .prod-info {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .prod-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .prod-cat {
      font-size: 0.8rem;
      color: var(--primary-light);
      background: #e8f5e9;
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      width: fit-content;
    }

    .prod-price {
      font-weight: 800;
      color: var(--gold-dark);
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    .btn-delete {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.2s;
      width: 100%;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .status-msg {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .status-msg.error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #f87171;
    }

    .status-msg.success {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }
  </style>
</head>
<body>

  <!-- هدر -->
  <header>
    <h1>🦜 پنل مدیریت طوطی آرا</h1>
    <button id="logoutBtn" class="btn-logout" style="display: none;" onclick="logout()">خروج از حساب</button>
  </header>

  <div class="container">

    <!-- بخش ورود (رمز عبور ساده) -->
    <div id="loginSection" class="card">
      <h2 class="card-title">🔐 ورود به پنل مدیریت</h2>
      <div id="loginError" class="status-msg error"></div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="adminPass">رمز عبور ادمین:</label>
          <input type="password" id="adminPass" placeholder="رمز عبور را وارد کنید" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">ورود به پنل</button>
      </form>
    </div>

    <!-- بخش مدیریت (فقط بعد از ورود نمایش داده می‌شود) -->
    <div id="adminPanel" style="display: none;">

      <!-- پیام وضعیت عمومی -->
      <div id="panelMsg" class="status-msg"></div>

      <!-- کارت افزودن پرنده جدید -->
      <div class="card">
        <h2 class="card-title">➕ افزودن پرنده جدید</h2>
        <form id="addBirdForm" onsubmit="handleAddBird(event)">
          
          <div class="form-group">
            <label for="bName">نام پرنده / عنوان آگهی:</label>
            <input type="text" id="bName" placeholder="مثال: جوجه گرین‌چیک آناناسی دونخور" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="bCategory">نژاد پرنده:</label>
              <select id="bCategory">
                <option value="گرین‌چیک">گرین‌چیک</option>
                <option value="راهب">راهب</option>
                <option value="خورشیدی">خورشیدی (سان کانور)</option>
                <option value="سایر">سایر پرندگان</option>
              </select>
            </div>

            <div class="form-group">
              <label for="bPrice">قیمت (تومان):</label>
              <input type="number" id="bPrice" placeholder="مثال: 3500000" required>
            </div>
          </div>

          <div class="form-group">
            <label for="bDesc">توضیحات کوتاه:</label>
            <textarea id="bDesc" rows="3" placeholder="توضیحات سن، دستی بودن، سلامت و ..."></textarea>
          </div>

          <!-- بخش انتخاب عکس از گالری -->
          <div class="form-group">
            <label>تصویر پرنده:</label>
            <div class="file-drop-area">
              <input type="file" id="bImageFile" accept="image/*" onchange="previewImage(event)" required>
              <div class="file-label">
                <span>📁 انتخاب عکس از گالری گوشی</span>
                <span class="file-subtext">یا عکس را اینجا بکشید و رها کنید (JPG, PNG)</span>
              </div>
            </div>

            <!-- کادر پیش‌نمایش تصویر انتخابی -->
            <div id="previewBox" class="preview-box">
              <img id="previewImg" src="" alt="پیش‌نمایش">
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">
            ثبت و بارگذاری پرنده
          </button>
        </form>
      </div>

      <!-- کارت فهرست پرندگان ثبت‌شده -->
      <div class="card">
        <h2 class="card-title">📋 پرندگان ثبت‌شده در سایت</h2>
        <div id="loadingProducts" style="text-align: center; padding: 1.5rem; color: #64748b;">در حال دریافت اطلاعات...</div>
        <div id="productsList" class="product-grid"></div>
      </div>

    </div>

  </div>

  <script>
    // کلید رمز عبور ثابت
    const ADMIN_PASSWORD = "ara123";

    // بررسی اولیه و اتصال
    let client = null;

    function getClient() {
      if (window.supabaseClient) {
        return window.supabaseClient;
      }
      if (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
        window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        return window.supabaseClient;
      }
      return null;
    }

    // بررسی ورود
    window.addEventListener('DOMContentLoaded', () => {
      client = getClient();
      if (!client) {
        showMsg("فایل supabase-config.js لود نشد یا اطلاعات اتصال ناقص است.", "error");
      }

      const isAuth = sessionStorage.getItem('ara_admin_auth');
      if (isAuth === 'true') {
        showPanel
