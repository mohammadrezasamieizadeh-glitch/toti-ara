<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مدیریت | آرا</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>:root{--n:#071827;--n2:#0d2a3e;--g:#e8b84b;--p:#f4f1e8;--red:#a33131}*{box-sizing:border-box}body{margin:0;background:var(--p);color:#21333b;font-family:Tahoma,"Segoe UI",sans-serif}.wrap{width:min(960px,calc(100% - 32px));margin:auto}.top{background:var(--n);color:#fff;padding:18px 0}.brand{color:var(--g);font-size:25px;font-weight:900}.back{color:#dce7e7;float:left;margin-top:7px}.panel{background:#fff;border:1px solid #ddd5c6;border-radius:7px;margin:30px 0;padding:28px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form{display:grid;gap:12px}input,textarea{width:100%;padding:11px;border:1px solid #cfc8ba;border-radius:4px;font:inherit}textarea{min-height:80px}button{padding:10px 16px;border:0;border-radius:4px;font:inherit;font-weight:bold;cursor:pointer}.gold{background:var(--g);color:var(--n)}.dark{background:var(--n2);color:#fff}.danger{background:var(--red);color:#fff}.muted{color:#68777a;font-size:13px}.message{min-height:24px;font-size:13px}.item{border-top:1px solid #e5dfd4;padding:16px 0}.item:first-child{border-top:0}.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.item h3{margin:0;color:var(--n)}h1,h2{color:var(--n)}@media(max-width:640px){.grid{grid-template-columns:1fr}.panel{padding:19px}}
</style></head><body><header class="top"><div class="wrap"><span class="brand">آرا</span><a class="back" href="index.html">بازگشت به سایت</a></div></header><main class="wrap"><section id="loginPanel" class="panel"><h1>ورود به مدیریت</h1><p class="muted">ورود فقط برای حسابی ممکن است که در Supabase نقش admin داشته باشد.</p><form id="loginForm" class="form"><input id="email" type="email" placeholder="ایمیل" required><input id="password" type="password" placeholder="رمز عبور" required><button class="gold">ورود</button><div id="loginMsg" class="message"></div></form></section><section id="appPanel" class="panel hidden"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h1>محصولات آرا</h1><button id="logout" class="dark">خروج</button></div><p class="muted">افزودن، ویرایش، حذف و تغییر وضعیت نمایش محصولات.</p><h2 id="formTitle">افزودن محصول</h2><form id="productForm" class="form"><input type="hidden" id="editId"><div class="grid"><input id="pname" placeholder="نام محصول" required><input id="pprice" placeholder="قیمت یا توضیح قیمت"></div><div class="grid"><input id="pemoji" placeholder="ایموجی" value="🦜"><input id="pimage" type="url" placeholder="نشانی تصویر http(s) (اختیاری)"></div><textarea id="pdesc" placeholder="توضیحات"></textarea><div><button class="gold">ذخیره</button> <button type="button" id="cancel" class="dark hidden">انصراف</button></div><div id="saveMsg" class="message"></div></form><h2>فهرست محصولات</h2><div id="list">در حال بارگذاری...</div></section></main><script>
const client=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];
function setSession(s){$('loginPanel').classList.toggle('hidden',!!s);$('appPanel').classList.toggle('hidden',!s);if(s)load()}
async function load(){const r=await client.from('products').select('*').order('created_at',{ascending:false});if(r.error){$('list').textContent=r.error.message;return}rows=r.data||[];$('list').innerHTML=rows.length?rows.map(p=>`<div class="item"><h3>${esc(p.emoji||'🦜')} ${esc(p.name)}</h3><div class="muted">${esc(p.description||'')} ${p.price?`| ${esc(p.price)}`:''} | وضعیت: ${p.available?'نمایش':'پنهان'}</div><div class="item-actions"><button class="dark" data-edit="${p.id}">ویرایش</button><button class="gold" data-toggle="${p.id}">${p.available?'پنهان کردن':'نمایش دادن'}</button><button class="danger" data-del="${p.id}">حذف</button></div></div>`).join(''):'محصولی ثبت نشده.'}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='در حال ورود...';const r=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=r.error?r.error.message:'ورود موفق بود.'};$('logout').onclick=()=>client.auth.signOut();client.auth.onAuthStateChange((_,s)=>setSession(s));client.auth.getSession().then(({data})=>setSession(data.session));
$('productForm').onsubmit=async e=>{e.preventDefault();$('saveMsg').textContent='در حال ذخیره...';const id=$('editId').value,data={name:$('pname').value,price:$('pprice').value,emoji:$('pemoji').value,description:$('pdesc').value,image_url:$('pimage').value,available:true};const r=id?await client.from('products').update(data).eq('id',id):await client.from('products').insert(data);$('saveMsg').textContent=r.error?r.error.message:'ذخیره شد.';if(!r.error){reset();load()}};
$('list').onclick=async e=>{const b=e.target, id=b.dataset.edit||b.dataset.toggle||b.dataset.del;if(!id)return;const p=rows.find(x=>String(x.id)===String(id));if(b.dataset.edit){$('editId').value=p.id;$('pname').value=p.name;$('pprice').value=p.price||'';$('pemoji').value=p.emoji||'';$('pimage').value=p.image_url||'';$('pdesc').value=p.description||'';$('formTitle').textContent='ویرایش محصول';$('cancel').classList.remove('hidden')}else if(b.dataset.toggle){await client.from('products').update({available:!p.available}).eq('id',id);load()}else if(confirm('این محصول حذف شود؟')){await client.from('products').delete().eq('id',id);load()}};function reset(){$('productForm').reset();$('editId').value='';$('pemoji').value='🦜';$('formTitle').textContent='افزودن محصول';$('cancel').classList.add('hidden')}$('cancel').onclick=reset;
</script></body></html>
