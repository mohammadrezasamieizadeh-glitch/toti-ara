<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سالن پرورش پرندگان آرا</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background-color: #08140c; color: #eaf5ed; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; }
        .hero-banner { width: 100%; border-radius: 16px; margin-bottom: 20px; }

        /* دکمه‌های پرنده‌ها */
        .categories-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
        .cat-card {
            background: #12331b; border: 1px solid #1f592f; border-radius: 14px; padding: 16px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .cat-title { font-size: 16px; font-weight: bold; }

        /* دکمه اینستاگرام */
        .insta-btn {
            display: block; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            color: white; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold;
        }

        /* مودال گالری */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; padding: 20px; overflow-y: auto; }
        .modal.active { display: block; }
        .close-btn { color: white; font-size: 30px; cursor: pointer; float: left; }
        .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 50px; }
        .gallery-item img { width: 100%; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <img src="hero.png" class="hero-banner">

    <div class="categories-grid">
        <div class="cat-card" onclick="openGallery('راهب')"><span class="cat-title">🦜 عکس‌های طوطی راهب</span></div>
        <div class="cat-card" onclick="openGallery('گرینچیک')"><span class="cat-title">🦜 عکس‌های طوطی گرین‌چیک</span></div>
        <div class="cat-card" onclick="openGallery('خورشیدی')"><span class="cat-title">🦜 عکس‌های طوطی خورشیدی</span></div>
    </div>

    <a href="https://instagram.com/ara_bird_qaz" class="insta-btn">📸 مشاهده پیج اینستاگرام</a>
</div>

<div id="galleryModal" class="modal">
    <span class="close-btn" onclick="closeGallery()">✕</span>
    <div id="galleryGrid" class="gallery-grid"></div>
</div>

<script>
    const WORKER_URL = 'https://toti-ara-gallery.mohammadrezasamieizadeh.workers.dev/api/gallery';

    async function fetchBirdsData() {
        if (window.supabaseClient) {
            try {
                const { data } = await window.supabaseClient.from('products').select('*');
                if (data) return data;
            } catch (e) {}
        }
        try {
            const res = await fetch(WORKER_URL);
            return await res.json();
        } catch (e) { return []; }
    }

    async function openGallery(category) {
        const modal = document.getElementById('galleryModal');
        const grid = document.getElementById('galleryGrid');
        modal.classList.add('active');
        grid.innerHTML = 'در حال بارگذاری...';
        
        const data = await fetchBirdsData();
        const filtered = data.filter(b => (b.category || '').includes(category));
        
        grid.innerHTML = filtered.map(b => `<div class="gallery-item"><img src="${b.image_url || b.url}"></div>`).join('');
    }

    function closeGallery() { document.getElementById('galleryModal').classList.remove('active'); }
</script>

</body>
</html>
