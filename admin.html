<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | سالن طوطی آرا</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #081a15;
      color: #e2f0ea;
      padding: 16px;
    }
    .container {
      max-width: 550px;
      margin: 0 auto;
      background: #0c231c;
      border: 1px solid #1f4e3e;
      border-radius: 16px;
      padding: 20px;
    }
    h1 { color: #ffd15c; font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
    .card { background: #081a15; border: 1px solid #1a3d31; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #a3c9bb; }
    input, select, textarea {
      width: 100%; padding: 12px; background: #05120e; border: 1px solid #1f4e3e;
      border-radius: 8px; color: #fff; font-family: inherit; margin-bottom: 14px; font-size: 0.95rem;
    }
    button {
      background: linear-gradient(135deg, #ffd15c, #f39c12); color: #0c231c; border: none;
      padding: 12px; border-radius: 8px; font-weight: 800; font-family: inherit;
      cursor: pointer; width: 100%; font-size: 1rem; transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .product-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #05120e; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #1a3d31;
    }
    .del-btn { width: auto; background: #e74c3c; color: #fff; padding: 6px 12px; font-size: 0.8rem; }
    .preview-box { text-align: center; margin-bottom: 12px; }
    .preview-box img { max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #1f4e3e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>پنل مدیریت پرندگان سالن طوطی آرا</h1>
    
    <!-- بخش ورود فقط با رمز -->
    <div id="authSection" class="card">
      <label>رمز عبور پنل مدیریت:</label>
      <input type="password" id="adminPass" placeholder="رمز عبور را وارد کنید...">
      <button onclick="checkPass()">ورود به پنل</button>
    </div>

    <!-- فرم افزودن و مدیریت پرنده -->
    <div id="dashboardSection" style="display:none;">
      <div class="card">
        <h2 style="font-size:1.1rem;margin-bottom:14px;color:#ffd15c;">افزودن پرنده به گالری</h2>
        
        <label>دسته‌بندی پرنده:</label>
        <select id="pCategory">
          <option value="sun">🦜 خورشیدی</option>
          <option value="monk">🦜 راهب</option>
          <option value="green-cheek" selected>🦜 گرین چیک</option>
        </select>

        <label>انتخاب عکس پرنده (از حافظه گوشی):</label>
        <input type="file" id="pFile" accept="image/*" onchange="previewImg(event)">
        <div id="previewArea" class="preview-box" style="display:none;">
          <img id="imgPreview" src="" alt="پیش‌نمایش">
        </div>

        <label>نام / سن پرنده:</label>
        <input type="text" id="pName" placeholder="مثال: جوجه گرین چیک یلو ساید سرلاکی">

        <label>وضعیت یا قیمت:</label>
        <input type="text" id="pPrice" placeholder="مثال: موجود / فروخته شد / قیمت توافقی">

        <label>توضیحات کوتاه (اختیاری):</label>
        <textarea id="pDesc" rows="2" placeholder="توضیحات سلامت، رام بودن و..."></textarea>

        <button id="saveBtn" onclick="uploadAndSave()">➕ بارگذاری و ثبت در گالری</button>
      </div>

      <div class="card">
        <h2 style="font-size:1.1rem;margin-bottom:12px;color:#ffd15c;">پرندگان ثبت‌شده</h2>
        <div id="productList">در حال بارگذاری لیست...</div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_SECRET = 'ara1234'; // رمز عبور مدیریت

    function checkPass() {
      const pass = GAPGPTMASKTOKENyljulr5f1vX0X'adminPass').value;
      if (pass === ADMIN_SECRET) {
        GAPGPTMASKTOKENyljulr5f1vX1X'authSection').style.display = 'none';
        GAPGPTMASKTOKENyljulr5f1vX2X'dashboardSection').style.display = 'block';
        loadProducts();
      } else {
        alert('رمز عبور اشتباه است!');
      }
    }

    function previewImg(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          GAPGPTMASKTOKENyljulr5f1vX3X'imgPreview').src = evt.target.result;
          GAPGPTMASKTOKENyljulr5f1vX4X'previewArea').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    async function uploadAndSave() {
      const client = window.supabaseClient;
      if (!client) { alert('خطا در دسترسی به پایگاه داده'); return; }

      const file = GAPGPTMASKTOKENyljulr5f1vX5X'pFile').files[0];
      const name = GAPGPTMASKTOKENyljulr5f1vX6X'pName').value.trim();
      const category = GAPGPTMASKTOKENyljulr5f1vX7X'pCategory').value;
      const price = GAPGPTMASKTOKENyljulr5f1vX8X'pPrice').value.trim();
      const description = GAPGPTMASKTOKENyljulr5f1vX9X'pDesc').value.trim();

      if (!file) { alert('لطفاً حتماً یک عکس انتخاب کنید'); return; }
      if (!name) { alert('لطفاً عنوان یا نام پرنده را بنویسید'); return; }

      const btn = GAPGPTMASKTOKENyljulr5f1vX10X'saveBtn');
      btn.disabled = true;
      btn.innerText = 'در حال بارگذاری تصویر...';

      try {
        // نام تصادفی و استاندارد برای فایل
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;

        // آپلود در باکت gallery
        const { error: uploadErr } = await client.storage.from('gallery').upload(fileName, file);
        if (uploadErr) throw new Error('خطا در آپلود عکس: ' + uploadErr.message);

        // دریافت آدرس عکس عمومی
        const { data: { publicUrl } } = client.storage.from('gallery').getPublicUrl(fileName);

        btn.innerText = 'در حال ذخیره اطلاعات...';

        // ذخیره محصول در جدول
        const { error: dbErr } = await client.from('products').insert([{
          name,
          category,
          price,
          description,
          image_url: publicUrl,
          available: true
        }]);

        if (dbErr) throw new Error('خطا در ثبت اطلاعات: ' + dbErr.message);

        alert('✅ پرنده با موفقیت بارگذاری و ثبت شد!');
        GAPGPTMASKTOKENyljulr5f1vX11X'pFile').value = '';
        GAPGPTMASKTOKENyljulr5f1vX12X'pName').value = '';
        GAPGPTMASKTOKENyljulr5f1vX13X'pPrice').value = '';
        GAPGPTMASKTOKENyljulr5f1vX14X'pDesc').value = '';
        GAPGPTMASKTOKENyljulr5f1vX15X'previewArea').style.display = 'none';
        loadProducts();

      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '➕ بارگذاری و ثبت در گالری';
      }
    }

    async function loadProducts() {
      const client = window.supabaseClient;
      if (!client) return;
      const list = GAPGPTMASKTOKENyljulr5f1vX16X'productList');
      const { data, error } = await client.from('products').select('*').order('id', { ascending: false });

      if (error) { list.innerHTML = 'خطا در بارگذاری لیست.'; return; }
      if (!data || data.length === 0) { list.innerHTML = 'هنوز تصویری ثبت نشده است.'; return; }

      list.innerHTML = data.map(p => `
        <div class="product-row">
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${p.image_url}" style="width:45px;height:45px;border-radius:6px;object-fit:cover;">
            <div>
              <div style="font-weight:bold;">${p.name}</div>
              <div style="font-size:0.8rem;color:#8fa79d;">${p.price || 'توافقی'}</div>
            </div>
          </div>
          <button class="del-btn" onclick="deleteItem(${p.id})">حذف</button>
        </div>
      `).join('');
    }

    async function deleteItem(id) {
      if (!confirm('آیا از حذف این پرنده اطمینان دارید؟')) return;
      const client = window.supabaseClient;
      const { error } = await client.from('products').delete().eq('id', id);
      if (error) alert('خطا در حذف: ' + error.message);
      else loadProducts();
    }
  </script>
</body>
</html>
