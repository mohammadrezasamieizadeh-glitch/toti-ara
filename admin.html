<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت گالری طوطی آرا</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0d1b1e; --card: #162a2d; --accent: #2e7d32; --text: #e0e0e0; --err: #d32f2f; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .card { background: var(--card); padding: 24px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    h2 { text-align: center; color: #4caf50; margin-bottom: 20px; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input, select, textarea, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; background: #081012; color: #fff; box-sizing: border-box; }
    button { background: var(--accent); border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
    button:hover { background: #388e3c; }
    .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; }
    .err { background: rgba(211,47,47,0.2); color: #ff8a80; border: 1px solid var(--err); }
    .succ { background: rgba(46,125,50,0.2); color: #b9f6ca; border: 1px solid var(--accent); }
  </style>
</head>
<body>

<div class="card">
  <h2>افزودن پرنده به گالری</h2>
  <form id="addBirdForm">
    <label>دسته‌بندی:</label>
    <select id="category">
      <option value="گرین‌چیک">گرین‌چیک</option>
      <option value="راهب">راهب</option>
      <option value="خورشیدی">خورشیدی</option>
    </select>

    <label>عنوان پرنده:</label>
    <input type="text" id="title" required placeholder="مثلاً: گرین‌چیک اکستریم رد">

    <label>قیمت / وضعیت:</label>
    <input type="text" id="price" placeholder="مثلاً: ۳,۵۰۰,۰؛۰ تومان یا تماس بگیرید">

    <label>توضیحات:</label>
    <textarea id="description" rows="3" placeholder="جزئیات سن، سلامت و..."></textarea>

    <label>تصویر پرنده:</label>
    <input type="file" id="imageFile" accept="image/*" required>

    <button type="submit" id="submitBtn">ثبت و ارسال</button>
  </form>
  <div id="statusMsg" class="status"></div>
</div>

<script>
  // تنظیمات اتصال مستقیم به Supabase
  const SUPABASE_URL = "https://wixmvefftzefmryijlyd.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpeG12ZWZmdHplZm1yeWlqbHlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjYzNTkxMzgsImV4cCI6MjA0MTkzNTEzOH0.cR8kUXb9e8s51o4g270uWwB7tO-yGv9mNl_yN4e5g";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('addBirdForm');
  const btn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  function showMsg(text, isError = false) {
    statusMsg.style.display = 'block';
    statusMsg.className = 'status ' + (isError ? 'err' : 'succ');
    statusMsg.innerText = text;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.innerText = 'در حال ارسال...';
    statusMsg.style.display = 'none';

    try {
      const file = document.getElementById('imageFile').files[0];
      if (!file) throw new Error('لطفاً یک تصویر انتخاب کنید.');

      // ۱. آپلود تصویر به باکت gallery
      const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
      const { data: uploadData, error: uploadError } = await supabase.storage
        .from('gallery')
        .upload(fileName, file);

      if (uploadError) throw uploadError;

      // دریافت آدرس عمومی تصویر
      const { data: urlData } = supabase.storage.from('gallery').getPublicUrl(fileName);
      const imageUrl = urlData.publicUrl;

      // ۲. ثبت اطلاعات در جدول birds
      const { error: dbError } = await supabase
        .from('birds')
        .insert([{
          title: document.getElementById('title').value,
          category: document.getElementById('category').value,
          price: document.getElementById('price').value,
          description: document.getElementById('description').value,
          image_url: imageUrl
        }]);

      if (dbError) throw dbError;

      showMsg('✅ پرنده با موفقیت ثبت و افزوده شد.');
      form.reset();
    } catch (err) {
      console.error(err);
      showMsg('خطا: ' + (err.message || 'مشکلی در اتصال یا ثبت پیش آمد. دوباره امتحان کنید.'), true);
    } finally {
      btn.disabled = false;
      btn.innerText = 'ثبت و ارسال';
    }
  });
</script>
</body>
</html>
