<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت آرا</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#20312b;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d7e1da;padding-bottom:18px}h1{color:#173c2e}h2{font-size:1.2rem;color:#315643}section{background:#fff;border:1px solid #dce6df;border-radius:8px;padding:20px;margin:20px 0}label{display:block;margin:12px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #bfcfc4;border-radius:4px;font:inherit}textarea{min-height:90px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}button{border:1px solid #315643;background:#315643;color:#fff;padding:10px 16px;border-radius:4px;cursor:pointer;margin:8px 4px 0 0}button.secondary{background:#fff;color:#315643}.danger{background:#a13e35}.hidden{display:none}.notice{padding:10px;background:#eef5ef;border-right:4px solid #548064}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:18px}.item{border:1px solid #dce6df;padding:14px;border-radius:6px}.item img,.preview{max-width:180px;max-height:130px;object-fit:cover;display:block;margin-top:8px}</style></head><body><div class="wrap"><header><h1>مدیریت آرا</h1><button id="signout" class="secondary hidden">خروج</button></header><p id="message" class="notice">برای مدیریت، وارد شوید.</p><section id="auth"><h2>ورود مدیر</h2><form id="login-form"><label for="email">ایمیل</label><input id="email" type="email" required autocomplete="username"><label for="password">رمز عبور</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">ورود</button></form></section><div id="panel" class="hidden"><section><h2>محصولات پرندگان</h2><form id="product-form"><input id="product-id" type="hidden"><div class="formgrid"><div><label for="slug">شناسه ثابت (green / monk / sun)</label><input id="slug" required></div><div><label for="name">نام</label><input id="name" required></div><div><label for="price">قیمت</label><input id="price"></div><div><label for="emoji">نشانه</label><input id="emoji" value="🦜"></div></div><label for="description">توضیحات</label><textarea id="description"></textarea><label><input id="available" type="checkbox" checked> موجود است</label><label for="cover-file">تصویر جلد</label><input id="cover-file" type="file" accept="image/*"><img id="cover-preview" class="preview hidden" alt="پیش‌نمایش جلد"><button type="submit">ذخیره محصول</button><button type="button" id="cancel-edit" class="secondary">پاک کردن فرم</button></form><div id="products" class="items"></div></section><section><h2>متن بخش‌های سایت</h2><form id="section-form"><label for="section-key">بخش</label><select id="section-key"><option value="about">درباره</option><option value="care">نگهداری</option><option value="contact">تماس</option><option value="gallery">گالری</option></select><label for="section-title">عنوان</label><input id="section-title"><label for="section-body">متن</label><textarea id="section-body"></textarea><label for="section-file">تصویر بخش</label><input id="section-file" type="file" accept="image/*"><button type="submit">ذخیره بخش</button></form></section><section><h2>تصاویر گالری پرنده</h2><label for="gallery-product">پرنده</label><select id="gallery-product"></select><label for="gallery-file">آپلود تصویر</label><input id="gallery-file" type="file" accept="image/*"><img id="gallery-preview" class="preview hidden" alt="پیش‌نمایش گالری"><button id="upload-gallery">آپلود</button><div id="gallery-items" class="items"></div></section></div></div><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){'use strict';const cfg=window.ARA_SUPABASE_CONFIG||{};const $=id=>document.getElementById(id);let client=null,editing=null;function msg(t,bad){$('message').textContent=t;$('message').style.borderColor=bad?'#a13e35':'#548064'}function valid(){return cfg.url&&!cfg.url.includes('YOUR-')&&cfg.anonKey&&!cfg.anonKey.includes('YOUR-')}function readable(e){return e?.message||'خطای نامشخصی رخ داد.'}function preview(input,img){const f=input.files[0];if(f){img.src=URL.createObjectURL(f);img.classList.remove('hidden')}}async function upload(file,folder){if(!file)return null;const path=folder+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const r=await client.storage.from('product-images').upload(path,file,{upsert:false});if(r.error)throw r.error;return client.storage.from('product-images').getPublicUrl(path).data.publicUrl}async function loadProducts(){const r=await client.from('products').select('*').order('created_at');if(r.error)throw r.error;$('products').innerHTML='';$('gallery-product').innerHTML='';(r.data||[]).forEach(p=>{const d=document.createElement('div');d.className='item';d.innerHTML='<strong>'+p.name+'</strong><p>'+p.slug+'</p>';const edit=document.createElement('button');edit.textContent='ویرایش';edit.onclick=()=>editProduct(p);const del=document.createElement('button');del.textContent='حذف';del.className='danger';del.onclick=()=>deleteProduct(p.id);d.append(edit,del);$('products').append(d);const o=document.createElement('option');o.value=p.id;o.textContent=p.name;o.dataset.slug=p.slug;$('gallery-product').append(o)});await loadGallery()}function editProduct(p){editing=p;$('product-id').value=p.id;$('slug').value=p.slug;$('name').value=p.name;$('description').value=p.description||'';$('price').value=p.price||'';$('emoji').value=p.emoji||'🦜';$('available').checked=p.available!==false;window.scrollTo({top:0,behavior:'smooth'})}async function deleteProduct(id){if(!confirm('این محصول حذف شود؟'))return;try{const r=await client.from('products').delete().eq('id',id);if(r.error)throw r.error;msg('محصول حذف شد.');await loadProducts()}catch(e){msg('حذف محصول انجام نشد: '+readable(e),true)}}async function loadGallery(){const id=$('gallery-product').value;if(!id)return;const r=await client.from('product_images').select('*').eq('product_id',id).order('created_at');if(r.error)throw r.error;$('gallery-items').innerHTML='';(r.data||[]).forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<img src="'+x.url+'" alt="'+(x.alt_text||'')+'">';const b=document.createElement('button');b.textContent='حذف تصویر';b.className='danger';b.onclick=()=>deleteGallery(x);d.append(b);$('gallery-items').append(d)})}async function deleteGallery(x){try{const r=await client.from('product_images').delete().eq('id',x.id);if(r.error)throw r.error;msg('تصویر حذف شد.');await loadGallery()}catch(e){msg('حذف تصویر انجام نشد: '+readable(e),true)}}
$('cover-file').onchange=()=>preview($('cover-file'),$('cover-preview'));$('gallery-file').onchange=()=>preview($('gallery-file'),$('gallery-preview'));$('login-form').onsubmit=async e=>{e.preventDefault();if(!valid()){msg('ابتدا URL و کلید Supabase را در supabase-config.js تنظیم کنید.',true);return}try{client=window.supabase.createClient(cfg.url,cfg.anonKey);const r=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;$('auth').classList.add('hidden');$('panel').classList.remove('hidden');$('signout').classList.remove('hidden');msg('ورود موفق بود.');await loadProducts()}catch(x){msg('ورود انجام نشد: '+readable(x),true)}};$('signout').onclick=async()=>{await client.auth.signOut();location.reload()};$('cancel-edit').onclick=()=>{$('product-form').reset();editing=null};$('product-form').onsubmit=async e=>{e.preventDefault();try{const cover=await upload($('cover-file').files[0],'covers');const data={slug:$('slug').value.trim(),name:$('name').value.trim(),description:$('description').value,price:$('price').value,emoji:$('emoji').value,available:$('available').checked,updated_at:new Date().toISOString()};if(cover)data.image_url=cover;let r=editing?await client.from('products').update(data).eq('id',editing.id):await client.from('products').insert(data);if(r.error)throw r.error;msg('محصول ذخیره شد.');$('cancel-edit').click();await loadProducts()}catch(x){msg('ذخیره محصول انجام نشد: '+readable(x),true)}};$('gallery-product').onchange=()=>loadGallery().catch(e=>msg(readable(e),true));$('upload-gallery').onclick=async()=>{try{const file=$('gallery-file').files[0],id=$('gallery-product').value;if(!file||!id)throw new Error('پرنده و فایل را انتخاب کنید.');const url=await upload(file,'gallery');const r=await client.from('product_images').insert({product_id:id,path:url,url,alt_text:file.name});if(r.error)throw r.error;msg('تصویر گالری آپلود شد.');await loadGallery()}catch(x){msg('آپلود انجام نشد: '+readable(x),true)}};})();</script></body></html>
