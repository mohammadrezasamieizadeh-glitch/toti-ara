<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | سالن طوطی آرا</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #081a15;
      color: #e2f0ea;
      padding: 20px;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #0c231c;
      border: 1px solid #1f4e3e;
      border-radius: 16px;
      padding: 24px;
    }
    h1 { color: #ffd15c; font-size: 1.4rem; margin-bottom: 20px; text-align: center; }
    .card { background: #081a15; border: 1px solid #1a3d31; border-radius: 12px; padding: 18px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #a3c9bb; }
    input, textarea, select {
      width: 100%; padding: 12px 14px; background: #05120e; border: 1px solid #1f4e3e;
      border-radius: 8px; color: #fff; font-family: inherit; margin-bottom: 14px;
    }
    input[type="file"] {
      padding: 10px;
      background: #0d2820;
      cursor: pointer;
    }
    button {
      background: linear-gradient(135deg, #ffd15c, #f39c12); color: #0c231c; border: none;
      padding: 12px 20px; border-radius: 8px; font-weight: 800; font-family: inherit;
      cursor: pointer; width: 100%; font-size: 1rem; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .preview-container {
      text-align: center;
      margin-bottom: 14px;
      display: none;
    }
    .preview-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      border: 1px solid #ffd15c;
    }
    .product-list { margin-top: 15px; }
    .product-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #05120e; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #1a3d31;
    }
    .del-btn { width: auto; background: #e74c3c; color: #fff; padding: 6px 14px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>پنل مدیریت سالن طوطی آرا</h1>
    
    <!-- فرم ورود با رمز عبور -->
    <div id="authSection" class="card">
      <h2 style="font-size:1.1rem;margin-bottom:12px;color:#ffd15c;">ورود مدیر</h2>
      <label>رمز عبور پنل:</label>
      <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کنید...">
      <button onclick="login()">ورود به پنل</button>
    </div>

    <!-- داشبورد مدیریت -->
    <div id="dashboardSection" style="display:none;">
      <div class="card">
        <h2 style="font-size:1.1rem;margin-bottom:14px;color:#ffd15c;">➕ افزودن پرنده جدید</h2>
        
        <label>نام پرنده و مشخصات:</label>
        <input type="text" id="pName" placeholder="مثال: جوجه گرین چیک یلو ساید">
        
        <label>دسته‌بندی نژاد:</label>
        <select id="pCategory">
          <option value="green-cheek" selected>🦜 گرین‌چیک</option>
          <option value="monk">🦜 راهب</option>
          <option value="sun">🦜 خورشیدی</option>
        </select>
        
        <label>قیمت / وضعیت:</label>
        <input type="text" id="pPrice" placeholder="مثال: توافقی / دون‌خور / پرورشی">

        <label>انتخاب عکس پرنده از گالری:</label>
        <input type="file" id="pImageFile" accept="image/*" onchange="handleImagePreview(event)">
        
        <div id="imagePreviewContainer" class="preview-container">
          <img id="previewImage" class="preview-img" src="" alt="پیش‌نمایش">
        </div>

        <label>توضیحات تکمیلی:</label>
        <textarea id="pDesc" rows="3" placeholder="سن، میزان رام بودن، رژیم غذایی و سلامت..."></textarea>
        
        <button id="submitBtn" onclick="addProduct()">➕ ذخیره و ارسال به سایت</button>
      </div>

      <div class="card">
        <h2 style="font-size:1.1rem;margin-bottom:12px;color:#ffd15c;">📋 لیست پرندگان ثبت‌شده</h2>
        <div id="productList" class="product-list">در حال بارگذاری لیست...</div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASS = 'ara123';
    let selectedFile = null;

    function login() {
      const enteredPass = document.getElementById('adminPassword').value;
      if (enteredPass === ADMIN_PASS) {
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        loadAdminProducts();
      } else {
        alert('رمز عبور وارد شده نادرست است!');
      }
    }

    function handleImagePreview(event) {
      const file = event.target.files[0];
      if (!file) return;
      selectedFile = file;

      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('previewImage');
        preview.src = e.target.result;
        document.getElementById('imagePreviewContainer').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function addProduct() {
      const name = document.getElementById('pName').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const description = document.getElementById('pDesc').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!name) {
        alert('لطفاً نام پرنده را وارد کنید.');
        return;
      }

      if (!window.supabaseClient) {
        alert('اتصال به سرور برقرار نشد؛ لطفاً اینترنت و تنظیمات Supabase را بررسی فرمایید.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'در حال آپلود و ذخیره...';

      let imageUrl = '';

      try {
        // ۱. آپلود تصویر در صورت انتخاب فایل
        if (selectedFile) {
          const fileExt = selectedFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
          const filePath = `${fileName}`;

          const { data: uploadData, error: uploadError } = await window.supabaseClient
            .storage
            .from('product-images')
            .upload(filePath, selectedFile);

          if (uploadError) {
            throw new Error('خطا در بارگذاری عکس: ' + uploadError.message);
          }

          const { data: publicUrlData } = window.supabaseClient
            .storage
            .from('product-images')
            .getPublicUrl(filePath);

          imageUrl = publicUrlData.publicUrl;
        }

        // ۲. ذخیره اطلاعات در جدول محصولات
        const { error: insertError } = await window.supabaseClient
          .from('products')
          .insert([{
            name: name,
            price: price,
            description: description,
            image_url: imageUrl,
            available: true
          }]);

        if (insertError) {
          throw new Error('خطا در ذخیره اطلاعات: ' + insertError.message);
        }

        alert('پرنده با موفقیت ثبت شد!');
        
        // پاکسازی فرم
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pImageFile').value = '';
        document.getElementById('imagePreviewContainer').style.display = 'none';
        selectedFile = null;

        loadAdminProducts();

      } catch (err) {
        alert(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '➕ ذخیره و ارسال به سایت';
      }
    }

    async function loadAdminProducts() {
      const list = document.getElementById('productList');
      if (!window.supabaseClient) {
        list.innerHTML = 'خطا در برقراری ارتباط با پایگاه‌داده.';
        return;
      }

      const { data, error } = await window.supabaseClient
        .from('products')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        list.innerHTML = 'خطا در دریافت لیست پرندگان: ' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = 'هنوز موردی ثبت نشده است.';
        return;
      }

      list.innerHTML = data.map(p => `
        <div class="product-row">
          <div>
            <strong>${p.name}</strong> 
            <span style="color:#ffd15c; font-size:0.85rem; margin-right:8px;">(${p.price || 'بدون قیمت'})</span>
          </div>
          <button class="del-btn" onclick="deleteProduct('${p.id}')">حذف</button>
        </div>
      `).join('');
    }

    async function deleteProduct(id) {
      if (!confirm('آیا از حذف این پرنده اطمینان دارید؟')) return;
      
      const { error } = await window.supabaseClient
        .from('products')
        .delete()
        .eq('id', id);

      if (error) {
        alert('خطا در حذف: ' + error.message);
      } else {
        loadAdminProducts();
      }
    }
  </script>
</body>
</html>
