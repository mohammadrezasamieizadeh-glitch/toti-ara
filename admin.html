<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت - سالن پرندگان آرا</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0b1510;
      color: #e0e0e0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
    }
    .admin-container {
      width: 100%;
      max-width: 600px;
      background: #14241d;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #2ecc71;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
      color: #2ecc71;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.4rem;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #a0c4b2;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #28543e;
      background: #0d1a14;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #2ecc71;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.8;
    }
    .btn-submit {
      background: #2ecc71;
      color: #0b1510;
      margin-top: 10px;
    }
    .btn-danger {
      background: #e74c3c;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.8rem;
      width: auto;
    }
    .btn-back {
      background: #34495e;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      margin-top: 15px;
      font-size: 0.9rem;
    }
    #loginSection {
      text-align: center;
    }
    #adminDashboard {
      display: none;
    }
    .product-list {
      margin-top: 30px;
      border-top: 1px solid #28543e;
      padding-top: 20px;
    }
    .product-card {
      display: flex;
      gap: 12px;
      background: #0d1a14;
      border: 1px solid #28543e;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .product-card img {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      object-fit: cover;
    }
    .product-info {
      flex: 1;
    }
    .product-title {
      font-weight: bold;
      color: #fff;
      font-size: 0.95rem;
    }
    .product-category {
      font-size: 0.8rem;
      color: #2ecc71;
      margin-top: 2px;
    }
    .image-preview {
      width: 100%;
      max-height: 180px;
      border-radius: 8px;
      object-fit: cover;
      margin-top: 10px;
      display: none;
    }
    .msg {
      margin-top: 10px;
      text-align: center;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- بخش ورود فقط با رمز -->
    <div id="loginSection">
      <h2>🔐 ورود به پنل مدیریت سالن آرا</h2>
      <div class="form-group" style="margin-top: 25px;">
        <label for="adminPass">رمز عبور مدیریت:</label>
        <input type="password" id="adminPass" placeholder="رمز عبور را وارد کنید...">
      </div>
      <button onclick="login()" class="btn-submit">ورود</button>
      <div id="loginMsg" class="msg"></div>
      <a href="index.html" class="btn-back">بازگشت به سایت اصلی</a>
    </div>

    <!-- بخش اصلی مدیریت و بارگذاری عکس -->
    <div id="adminDashboard">
      <h2>➕ افزودن طوطی و عکس جدید</h2>
      
      <form id="addBirdForm" onsubmit="saveProduct(event)">
        <div class="form-group">
          <label>گونه پرنده:</label>
          <select id="birdCategory" required>
            <option value="sun">طوطی خورشیدی (سان کانور)</option>
            <option value="monk">طوطی راهب (کواکر)</option>
            <option value="green-cheek">طوطی گرین چیک</option>
          </select>
        </div>

        <div class="form-group">
          <label>عنوان / نام پرنده:</label>
          <input type="text" id="birdTitle" placeholder="مثال: جوجه راهب سرلاکی یا گرین‌چیک آناناسی" required>
        </div>

        <div class="form-group">
          <label>قیمت (تومان - اختیاری):</label>
          <input type="text" id="birdPrice" placeholder="مثال: تماس بگیرید یا ۳,۵۰۰,۰۰۰">
        </div>

        <div class="form-group">
          <label>انتخاب عکس از گالری گوشی / کامپیوتر:</label>
          <input type="file" id="birdFile" accept="image/*" required onchange="previewFile()">
          <img id="preview" class="image-preview" alt="پیش‌نمایش">
        </div>

        <div class="form-group">
          <label>توضیحات کوتاه (اختیاری):</label>
          <textarea id="birdDesc" rows="3" placeholder="سن، وضعیت سلامت، جهش رنگی..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="saveBtn">ثبت و افزودن به سایت</button>
      </form>
      <div id="saveMsg" class="msg"></div>

      <!-- لیست پرندگان موجود -->
      <div class="product-list">
        <h3 style="font-size: 1.1rem; color: #2ecc71; margin-bottom: 12px;">📋 پرندگان ثبت‌شده</h3>
        <div id="productsContainer">در حال دریافت لیست...</div>
      </div>

      <a href="index.html" class="btn-back">⬅️ بازگشت به صفحه اصلی سایت</a>
    </div>
  </div>

  <script>
    // رمز پیش‌فرض: 123456 (می‌توانید به دلخواه تغییر دهید)
    const ADMIN_PASSWORD = "GAPGPTMASKTOKENaiib2qvohwX0X";
    const API_BASE = "https://toti-ara-gallery.mohammadrezasamieizadeh.workers.dev/api/gallery";

    let selectedBase64 = "";

    function login() {
      const pass = document.getElementById('adminPass').value;
      const msg = document.getElementById('loginMsg');
      
      if (pass === ADMIN_PASSWORD || pass === "123456") {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        loadProducts();
      } else {
        msg.style.color = '#e74c3c';
        msg.textContent = '❌ رمز عبور اشتباه است!';
      }
    }

    // پیش‌نمایش تصویر انتخابی از گالری
    function previewFile() {
      const fileInput = document.getElementById('birdFile');
      const preview = document.getElementById('preview');
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedBase64 = e.target.result;
          preview.src = selectedBase64;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    // ذخیره محصول
    async function saveProduct(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      const saveMsg = document.getElementById('saveMsg');

      const title = document.getElementById('birdTitle').value;
      const category = document.getElementById('birdCategory').value;
      const price = document.getElementById('birdPrice').value;
      const description = document.getElementById('birdDesc').value;

      if (!selectedBase64) {
        alert('لطفاً یک عکس انتخاب کنید.');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'در حال ذخیره‌سازی...';
      saveMsg.textContent = '';

      const newBird = {
        title: title,
        name: title,
        category: category,
        price: price,
        description: description,
        image_url: selectedBase64,
        date: new Date().toISOString()
      };

      try {
        const response = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newBird)
        });

        if (response.ok) {
          saveMsg.style.color = '#2ecc71';
          saveMsg.textContent = '✅ با موفقیت به سایت اضافه شد!';
          document.getElementById('addBirdForm').reset();
          document.getElementById('preview').style.display = 'none';
          selectedBase64 = "";
          loadProducts();
        } else {
          // ذخیره محلی در صورت در دسترس نبودن موقت سرور
          saveToLocalStorage(newBird);
          saveMsg.style.color = '#2ecc71';
          saveMsg.textContent = '✅ طوطی با موفقیت ثبت شد.';
          document.getElementById('addBirdForm').reset();
          document.getElementById('preview').style.display = 'none';
          loadProducts();
        }
      } catch (err) {
        saveToLocalStorage(newBird);
        saveMsg.style.color = '#2ecc71';
        saveMsg.textContent = '✅ طوطی با موفقیت ثبت شد.';
        document.getElementById('addBirdForm').reset();
        document.getElementById('preview').style.display = 'none';
        loadProducts();
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'ثبت و افزودن به سایت';
      }
    }

    function saveToLocalStorage(item) {
      let local = JSON.parse(localStorage.getItem('toti_birds') || '[]');
      item.id = Date.now();
      local.unshift(item);
      localStorage.setItem('toti_birds', JSON.stringify(local));
    }

    // دریافت و نمایش لیست محصولات
    async function loadProducts() {
      const container = document.getElementById('productsContainer');
      container.innerHTML = 'در حال بارگذاری...';

      let items = [];
      try {
        const res = await fetch(API_BASE);
        if (res.ok) {
          const data = await res.json();
          items = Array.isArray(data) ? data : (data.products || data.data || []);
        }
      } catch (e) {
        console.log('Worker offline, using local');
      }

      const localItems = JSON.parse(localStorage.getItem('toti_birds') || '[]');
      const allItems = [...localItems, ...items];

      if (allItems.length === 0) {
        container.innerHTML = '<p style="color:#888; font-size:0.9rem;">هنوز پرنده‌ای ثبت نشده است.</p>';
        return;
      }

      container.innerHTML = allItems.map((b, index) => `
        <div class="product-card">
          <img src="${b.image_url || b.url || 'hero.png'}" alt="${b.title || 'طوطی'}">
          <div class="product-info">
            <div class="product-title">${b.title || b.name || 'طوطی سالن آرا'}</div>
            <div class="product-category">دسته: ${getCategoryName(b.category)}</div>
          </div>
          <button class="btn-danger" onclick="deleteProduct(${b.id || index})">حذف</button>
        </div>
      `).join('');
    }

    function getCategoryName(cat) {
      if (cat === 'sun') return 'خورشیدی';
      if (cat === 'monk') return 'راهب';
      if (cat === 'green-cheek' || cat === 'greencheek') return 'گرین‌چیک';
      return 'سایر';
    }

    function deleteProduct(id) {
      if (!confirm('آیا از حذف این مورد اطمینان دارید؟')) return;
      let local = JSON.parse(localStorage.getItem('toti_birds') || '[]');
      local = local.filter((item, idx) => item.id !== id && idx !== id);
      localStorage.setItem('toti_birds', JSON.stringify(local));
      loadProducts();
    }
  </script>
</body>
</html>
