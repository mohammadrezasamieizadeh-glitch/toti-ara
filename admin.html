<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت آرا</title><style>body{font-family:Tahoma,Arial;max-width:900px;margin:auto;padding:18px;background:#101310;color:#eee;line-height:1.8}section{border:1px solid #485047;padding:14px;margin:12px 0;border-radius:6px}input,textarea,button,select{font:inherit;padding:9px;margin:4px;border-radius:4px;border:1px solid #687268;background:#1d231e;color:#fff}input,textarea{width:100%}button{cursor:pointer}h1{font-size:25px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #394139;padding:7px;text-align:right}</style></head><body><h1>پنل مدیریت آرا</h1><section><h2>ورود / ثبت‌نام</h2><input id="email" type="email" placeholder="ایمیل"><input id="password" type="password" placeholder="رمز عبور"><button id="signup">ثبت‌نام</button><button id="signin">ورود</button><button id="signout">خروج</button><p id="authmsg"></p></section><section><h2>محصول</h2><input id="pid" type="hidden"><input id="name" placeholder="نام"><textarea id="desc" placeholder="توضیحات"></textarea><input id="price" placeholder="قیمت"><input id="image_url" placeholder="نشانی تصویر"><label>تصویر محصول <input id="file" type="file" accept="image/*"></label><button id="save">ذخیره</button><div id="products"></div></section><section><h2>بخش‌های سایت</h2><input id="skey" placeholder="کلید مثل about"><input id="stitle" placeholder="عنوان"><textarea id="sbody" placeholder="متن"></textarea><button id="sectionSave">ذخیره بخش</button></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const c=window.supabaseClient;const $=id=>document.getElementById(id);function msg(x){$('authmsg').textContent=x}if(!c){msg('اتصال آماده نیست: supabase-config.js و کتابخانه Supabase را بررسی کنید.');console.error('Supabase client is unavailable. Check the library and configuration.')}async function auth(fn){if(!c)return msg('ابتدا supabase-config.js را تنظیم کنید.');let r=await fn();msg(r.error?.message||'انجام شد')}$('signup').onclick=()=>auth(()=>c.auth.signUp({email:$('email').value,password:$('password').value}));$('signin').onclick=()=>auth(()=>c.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('signout').onclick=()=>auth(()=>c.auth.signOut());async function load(){if(!c)return;$('products').innerHTML='در حال دریافت...';let r=await c.from('products').select('*').order('name');if(r.error){$('products').innerHTML='خطا در خواندن محصولات: '+(r.error.message||'خطای نامشخص');return}$('products').innerHTML='<table><tr><th>نام</th><th>عملیات</th></tr>'+(r.data||[]).map(p=>`<tr><td>${p.name}</td><td><button onclick='edit(${JSON.stringify(p)})'>ویرایش</button><button onclick='del("${p.id}")'>حذف</button></td></tr>`).join('')+'</table>'}window.edit=p=>{['id','name','description','price','image_url'].forEach(k=>$(k==='id'?'pid':k).value=p[k]||'')};window.del=async id=>{if(c)await c.from('products').delete().eq('id',id);load()};$('save').onclick=async()=>{if(!c)return msg('تنظیمات اتصال ناقص است.');let id=$('pid').value,p={name:$('name').value,description:$('desc').value,price:$('price').value,image_url:$('image_url').value,available:true};let r=id?await c.from('products').update(p).eq('id',id).select().single():await c.from('products').insert(p).select().single();if($('file').files[0]&&r.data){let f=$('file').files[0],path=Date.now()+'-'+f.name;let u=await c.storage.from('product-images').upload(path,f);if(!u.error){let pub=c.storage.from('product-images').getPublicUrl(path).data.publicUrl;await c.from('product_images').insert({product_id:r.data.id,image_url:pub,caption:f.name})}}load()};$('sectionSave').onclick=async()=>{if(c)await c.from('site_sections').upsert({key:$('skey').value,title:$('stitle').value,body:$('sbody').value,updated_at:new Date().toISOString()});};load()</script></body></html>
